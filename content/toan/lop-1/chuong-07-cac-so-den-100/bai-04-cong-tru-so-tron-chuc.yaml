    markdown: |
      20 + 30 = ?

      2 chục + 3 chục = 5 chục.

      Vậy 20 + 30 = **50**.

      60 − 20: 6 chục − 2 chục = 4 chục. Vậy 60 − 20 = **40**.
    say: "Hai mươi cộng ba mươi. Hai chục cộng ba chục bằng năm chục. Vậy bằng năm mươi. Sáu mươi trừ hai mươi. Sáu chục trừ hai chục bằng bốn chục. Vậy bằng bốn mươi."

