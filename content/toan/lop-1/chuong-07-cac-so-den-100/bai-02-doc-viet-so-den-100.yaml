    text: "Giờ mình đọc và viết các số lớn hơn nhé!"

  - id: b2
    type: "text"
    markdown: |
      **35** gồm 3 chục và 5 đơn vị. Đọc là: **ba mươi lăm**.

      **47** gồm 4 chục và 7 đơn vị. Đọc là: **bốn mươi bảy**.

      **99** gồm 9 chục và 9 đơn vị. Đọc là: **chín mươi chín**.
    say: "Ba mươi lăm gồm ba chục và năm đơn vị. Bốn mươi bảy gồm bốn chục và bảy đơn vị. Chín mươi chín gồm chín chục và chín đơn vị."

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      Viết số: viết **chữ số chục** trước, **chữ số đơn vị** sau.

      2 chục 6 đơn vị → **26**
    say: "Viết số: viết chữ số chục trước, chữ số đơn vị sau."

