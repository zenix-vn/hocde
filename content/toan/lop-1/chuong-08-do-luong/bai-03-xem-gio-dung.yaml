    text: "Đồng hồ có hai kim. Mình cùng học cách xem giờ nhé!"

  - id: b2
    type: "text"
    markdown: |
      Đồng hồ có **kim ngắn** chỉ **giờ** và **kim dài** chỉ **phút**.

      Khi kim dài chỉ số **12**, kim ngắn chỉ số mấy thì là mấy **giờ**.

      🕒 là **3 giờ**.
    say: "Đồng hồ có kim ngắn chỉ giờ và kim dài chỉ phút. Khi kim dài chỉ số mười hai, kim ngắn chỉ số mấy thì là mấy giờ. Đồng hồ này chỉ ba giờ."

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: "Kim dài chỉ số **12**, kim ngắn chỉ số **6** → **6 giờ**."
    say: "Kim dài chỉ số mười hai, kim ngắn chỉ số sáu, là sáu giờ."

