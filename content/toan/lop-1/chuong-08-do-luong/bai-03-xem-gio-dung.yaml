    answer: { pairs: [["🕐", "1 giờ"], ["🕕", "6 giờ"], ["🕘", "9 giờ"]] }
    hint: "Nhìn kim ngắn chỉ số mấy."
    explanation: "🕐 là 1 giờ, 🕕 là 6 giờ, 🕘 là 9 giờ."

