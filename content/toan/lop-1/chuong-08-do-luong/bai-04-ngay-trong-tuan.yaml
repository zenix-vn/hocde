      Bé đi học từ thứ hai đến thứ sáu. Thứ bảy và chủ nhật bé được nghỉ.
    say: "Một tuần có bảy ngày: thứ hai, thứ ba, thứ tư, thứ năm, thứ sáu, thứ bảy, chủ nhật. Bé đi học từ thứ hai đến thứ sáu. Thứ bảy và chủ nhật bé được nghỉ."

