schema: 1
slug: toan1-xang-ti-met
title: "Xăng-ti-mét"
summary: "Làm quen đơn vị đo độ dài xăng-ti-mét (cm)."
est_minutes: 8
xp_reward: 25
status: published
blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Để biết bút chì dài bao nhiêu, bé dùng cây thước kẻ. Mình học đọc thước nhé!"

  - id: b2
    type: "text"
    markdown: |
      Đơn vị đo độ dài là **xăng-ti-mét**. Viết tắt: **cm**.

      Đặt vạch **0** của thước ở đầu bút chì. Đầu kia chỉ vạch 8, bút chì dài **8 cm**.
    say: "Đơn vị đo độ dài là xăng ti mét. Viết tắt là xê em. Đặt vạch không của thước ở đầu bút chì. Đầu kia chỉ vạch tám, bút chì dài tám xăng ti mét."

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      1. Đặt vạch **0** ở một đầu vật.

      2. Nhìn đầu còn lại chỉ vạch số mấy.

      Vạch số mấy thì dài **bấy nhiêu cm**.
    say: "Đặt vạch không ở một đầu vật. Nhìn đầu còn lại chỉ vạch số mấy. Vạch số mấy thì dài bấy nhiêu xăng ti mét."

  - id: b4
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "do-do-dai"
    prompt: "Viết tắt của xăng-ti-mét là:"
    options:
      - { id: "a", text: "cm" }
      - { id: "b", text: "kg" }
      - { id: "c", text: "m" }
    answer: { correct: ["a"] }
    hint: "Hai chữ cái: c và m."
    explanation: "Xăng-ti-mét viết tắt là cm."

  - id: b5
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "do-do-dai"
    prompt: "Đặt thước từ vạch 0. Đầu kia của cái kẹp chỉ vạch 5. Cái kẹp dài _ cm."
    answer: { accept: ["5"] }
    hint: "Vạch số mấy thì dài bấy nhiêu."
    explanation: "Cái kẹp dài 5 cm."

  - id: b6
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "do-do-dai"
    prompt: "Một que tính đo được 9 cm. Que tính dài _ cm."
    answer: { accept: ["9"] }
    hint: "Số đo chính là con số."
    explanation: "Que tính dài 9 cm."

  - id: b7
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "so-sanh-do-dai"
    prompt: "Sợi dây A dài 7 cm, sợi dây B dài 4 cm. Sợi nào dài hơn?"
    options:
      - { id: "a", text: "Sợi A" }
      - { id: "b", text: "Sợi B" }
      - { id: "c", text: "Bằng nhau" }
    answer: { correct: ["a"] }
    hint: "So sánh 7 và 4."
    explanation: "7 cm lớn hơn 4 cm, sợi A dài hơn."

  - id: b8
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "cong-do-dai"
    prompt: "Đoạn thẳng AB dài 3 cm, đoạn BC dài 4 cm. Cả hai đoạn dài _ cm."
    answer: { accept: ["7"] }
    hint: "Gộp lại thì làm phép cộng."
    explanation: "3 + 4 = 7. Cả hai đoạn dài 7 cm."

  - id: b9
    type: "summary"
    markdown: "Bé đã biết dùng thước đo độ dài bằng **xăng-ti-mét (cm)**."
    say: "Bé đã biết dùng thước đo độ dài bằng xăng ti mét."
