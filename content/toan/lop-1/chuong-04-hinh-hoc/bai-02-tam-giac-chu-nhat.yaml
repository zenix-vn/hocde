    text: "Còn hai hình nữa: hình tam giác và hình chữ nhật. Mình cùng khám phá!"

  - id: b2
    type: "text"
    markdown: |
      🔺 là **hình tam giác**. Hình tam giác có **3 cạnh**, 3 góc.

      🚪 có dạng **hình chữ nhật**. Hình chữ nhật có 4 cạnh, 4 góc, hai cạnh dài và hai cạnh ngắn.
    say: "Đây là hình tam giác. Hình tam giác có ba cạnh, ba góc. Cánh cửa có dạng hình chữ nhật. Hình chữ nhật có bốn cạnh, bốn góc, hai cạnh dài và hai cạnh ngắn."

  - id: b3
    type: "callout"
