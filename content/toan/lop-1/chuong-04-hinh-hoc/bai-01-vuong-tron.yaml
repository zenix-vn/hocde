      🟥 là **hình vuông**. Hình vuông có 4 cạnh bằng nhau.

      🔴 là **hình tròn**. Hình tròn không có góc, tròn đều.
    say: "Đây là hình vuông. Hình vuông có bốn cạnh bằng nhau. Đây là hình tròn. Hình tròn không có góc, tròn đều."

