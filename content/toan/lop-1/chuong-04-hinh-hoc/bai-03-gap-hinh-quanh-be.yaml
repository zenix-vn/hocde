blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Mình thi tìm hình nhé. Bé nhớ lại bốn hình đã học!"

  - id: b2
    type: "text"
    markdown: |
      Bốn hình bé đã học:

      🟥 hình vuông

      🔴 hình tròn

      🔺 hình tam giác

      🚪 hình chữ nhật
    say: "Bốn hình bé đã học: hình vuông, hình tròn, hình tam giác, hình chữ nhật."

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-hinh"
    prompt: "Chiếc bánh xe 🛞 có dạng hình gì?"
    options:
      - { id: "a", text: "Hình tròn" }
      - { id: "b", text: "Hình tam giác" }
      - { id: "c", text: "Hình chữ nhật" }
    answer: { correct: ["a"] }
    hint: "Bánh xe lăn được vì nó tròn đều."
    explanation: "Bánh xe có dạng hình tròn."

  - id: b4
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-hinh"
    prompt: "Quyển vở 📒 thường có dạng hình gì?"
    options:
      - { id: "a", text: "Hình tròn" }
      - { id: "b", text: "Hình chữ nhật" }
      - { id: "c", text: "Hình tam giác" }
    answer: { correct: ["b"] }
    hint: "Vở có hai cạnh dài, hai cạnh ngắn."
    explanation: "Quyển vở có dạng hình chữ nhật."

  - id: b5
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-hinh"
    prompt: "Mái nhà 🏠 phần trên có dạng hình gì?"
    options:
      - { id: "a", text: "Hình vuông" }
      - { id: "b", text: "Hình tròn" }
      - { id: "c", text: "Hình tam giác" }
    answer: { correct: ["c"] }
    hint: "Mái nhà nhọn lên trên."
    explanation: "Mái nhà có dạng hình tam giác."

