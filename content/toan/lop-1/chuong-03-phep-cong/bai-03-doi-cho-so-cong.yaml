  - id: b2
    type: "text"
    markdown: |
      🍊🍊 + 🍊🍊🍊 = 🍊🍊🍊🍊🍊

      2 + 3 = 5

      🍊🍊🍊 + 🍊🍊 = 🍊🍊🍊🍊🍊

      3 + 2 = 5
    say: "Hai quả cam cộng ba quả cam bằng năm quả cam. Ba quả cam cộng hai quả cam cũng bằng năm quả cam."

  - id: b3
