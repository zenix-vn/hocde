      Bé để **9** trong đầu, rồi đếm lùi 4: tám, bảy, sáu, năm.

      Vậy 9 − 4 = 5
    say: "Chín trừ bốn bằng mấy? Bé giữ số chín trong đầu rồi đếm lùi bốn: tám, bảy, sáu, năm. Vậy chín trừ bốn bằng năm."

