blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Phép cộng và phép trừ là hai người bạn thân. Bé xem nhé!"

  - id: b2
    type: "text"
    markdown: |
      Có 3 chú gà 🐔 và 4 chú vịt 🦆. Tất cả có 7 con.

      3 + 4 = 7

      4 + 3 = 7

      7 − 3 = 4

      7 − 4 = 3
    say: "Ba cộng bốn bằng bảy. Bốn cộng ba bằng bảy. Bảy trừ ba bằng bốn. Bảy trừ bốn bằng ba."

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: "Ba số **3, 4, 7** cho ta bốn phép tính. Hai phép **cộng** và hai phép **trừ**."
    say: "Ba số ba, bốn, bảy cho ta bốn phép tính. Hai phép cộng và hai phép trừ."

  - id: b4
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "quan-he-cong-tru"
    prompt: "2 + 5 = 7 thì 7 − 2 = _"
    answer: { accept: ["5"] }
    hint: "Lấy tổng bớt đi một số hạng."
    explanation: "7 − 2 = 5."

