  - id: b2
    type: "text"
    markdown: |
      15 − 3 = ?

      15 gồm 1 chục và 5 đơn vị. Trừ 3 đơn vị: 5 − 3 = 2.

      Vậy 15 − 3 = **12**.
    say: "Mười lăm trừ ba bằng mấy? Mười lăm gồm một chục và năm đơn vị. Trừ ba đơn vị: năm trừ ba bằng hai. Vậy mười lăm trừ ba bằng mười hai."

  - id: b3
    type: "callout"
    variant: "tip"
    markdown: |
      Giữ nguyên **số chục**, chỉ trừ **số đơn vị**.

      19 − 9 = 10
    say: "Giữ nguyên số chục, chỉ trừ số đơn vị."

