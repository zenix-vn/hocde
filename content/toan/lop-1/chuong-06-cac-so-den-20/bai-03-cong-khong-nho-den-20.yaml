      12 + 3 = ?

      12 gồm 1 chục và 2 đơn vị. Cộng 3 đơn vị: 2 + 3 = 5.

      Vậy 12 + 3 = **15**.
    say: "Mười hai cộng ba bằng mấy? Mười hai gồm một chục và hai đơn vị. Cộng ba đơn vị: hai cộng ba bằng năm. Vậy mười hai cộng ba bằng mười lăm."

