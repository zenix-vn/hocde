    prompt: "Lớp có 40 học sinh, 10 bạn đạt giỏi. Tỉ số phần trăm số học sinh giỏi là _ %."
    answer: { accept: ["25"] }
    hint: "(10 : 40) × 100."
    explanation: "25%."

  - id: b5
