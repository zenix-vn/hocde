blocks:
  - id: b1
    type: "text"
    markdown: |
      **25%** đọc là hai mươi lăm phần trăm, nghĩa là 25/100.

      **Tỉ số phần trăm của a và b** = (a : b) × 100%.

      Ví dụ: 3 trên 12 là (3 : 12) × 100% = **25%**.

  - id: b2
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "phan-tram"
    prompt: "50% = _/100"
    answer: { accept: ["50"] }
    hint: "Phần trăm là trên 100."
    explanation: "50/100."

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "phan-tram"
    prompt: "Phân số 1/4 bằng bao nhiêu phần trăm?"
    options:
      - { id: "a", text: "14%" }
      - { id: "b", text: "25%" }
      - { id: "c", text: "40%" }
    answer: { correct: ["b"] }
    hint: "1/4 = 25/100."
    explanation: "25%."

  - id: b4
    type: "exercise"
