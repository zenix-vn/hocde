blocks:
  - id: b1
    type: "text"
    markdown: |
      **Vận tốc** v = s : t

      **Quãng đường** s = v × t

      **Thời gian** t = s : v

      Ví dụ: xe đi 120 km trong 2 giờ thì v = 120 : 2 = 60 km/giờ.

