blocks:
  - id: b1
    type: "text"
    markdown: |
      **Hình hộp chữ nhật:** V = dài × rộng × cao.

      **Hình lập phương:** V = cạnh × cạnh × cạnh.

      Đơn vị: cm³, dm³, m³. **1 dm³ = 1 lít**.

  - id: b2
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "the-tich"
    prompt: "Hộp dài 5 cm, rộng 4 cm, cao 3 cm. Thể tích là _ cm³."
    answer: { accept: ["60"] }
    hint: "5 × 4 × 3."
    explanation: "60."

  - id: b3
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "the-tich"
    prompt: "Hình lập phương cạnh 6 cm. Thể tích là _ cm³."
    answer: { accept: ["216"] }
    hint: "6 × 6 × 6."
    explanation: "216."

  - id: b4
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "the-tich"
    prompt: "Bể dài 2 m, rộng 1 m, cao 1,5 m có thể tích _ m³ (viết 3)."
    answer: { accept: ["3"] }
    hint: "2 × 1 × 1,5."
    explanation: "3."

  - id: b5
    type: "exercise"
    kind: "fill_blank"
    points: 10
