  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Nhiều đoạn thẳng nối đuôi nhau tạo thành đường gấp khúc."

  - id: b2
    type: "text"
    markdown: |
      Đường gấp khúc **ABC** gồm hai đoạn thẳng AB và BC.

      Độ dài đường gấp khúc là **tổng độ dài** các đoạn thẳng.

      Ví dụ AB = 3 cm, BC = 2 cm thì ABC dài 3 + 2 = **5 cm**.

      Hình có **4 cạnh** gọi là **hình tứ giác**.
    say: "Đường gấp khúc gồm các đoạn thẳng nối đuôi nhau. Độ dài đường gấp khúc là tổng độ dài các đoạn thẳng. Hình có bốn cạnh gọi là hình tứ giác."

  - id: b3
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "duong-gap-khuc"
    prompt: "Đường gấp khúc có đoạn dài 4 cm và đoạn dài 5 cm. Cả đường dài _ cm."
    answer: { accept: ["9"] }
    hint: "Cộng độ dài các đoạn."
    explanation: "4 + 5 = 9 (cm)."

