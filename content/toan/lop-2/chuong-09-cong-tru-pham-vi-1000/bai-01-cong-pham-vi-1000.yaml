  - id: b2
    type: "text"
    markdown: |
      **243 + 125 = ?**

      Đơn vị: 3 + 5 = 8. Chục: 4 + 2 = 6. Trăm: 2 + 1 = 3.

      Vậy 243 + 125 = **368**.

      Có nhớ: **157 + 36**: 7 + 6 = 13 viết 3 nhớ 1; 5 + 3 + 1 = 9; trăm 1. Kết quả **193**.
    say: "Hai trăm bốn mươi ba cộng một trăm hai mươi lăm bằng ba trăm sáu mươi tám."

