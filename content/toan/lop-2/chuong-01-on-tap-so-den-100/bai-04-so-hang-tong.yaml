blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Các số trong phép tính đều có tên riêng. Bé làm quen nhé!"

  - id: b2
    type: "text"
    markdown: |
      **23 + 15 = 38**

      23 và 15 là **số hạng**. 38 là **tổng**.

      **50 − 20 = 30**

      50 là **số bị trừ**, 20 là **số trừ**, 30 là **hiệu**.
    say: "Hai mươi ba và mười lăm là số hạng. Ba mươi tám là tổng. Năm mươi là số bị trừ, hai mươi là số trừ, ba mươi là hiệu."

