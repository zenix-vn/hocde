    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Tia số giống như cái thước, các số xếp hàng từ bé đến lớn."

  - id: b2
    type: "text"
    markdown: |
      0 — 10 — 20 — 30 — 40 — 50

      Nhảy từng **10** là cộng thêm 10. Trên tia số, số bên phải **lớn hơn** số bên trái.

      Số liền sau của 39 là **40**. Số liền trước của 40 là **39**.
    say: "Trên tia số, số bên phải lớn hơn số bên trái. Số liền sau của ba mươi chín là bốn mươi. Số liền trước của bốn mươi là ba mươi chín."

  - id: b3
