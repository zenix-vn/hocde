    markdown: |
      Đơn vị đo khối lượng là **ki-lô-gam**, viết tắt là **kg**.

      Bao gạo cân nặng **5 kg**. Quả dưa cân nặng **2 kg**.

      5 kg lớn hơn 2 kg nên bao gạo **nặng hơn** quả dưa.
    say: "Đơn vị đo khối lượng là ki lô gam, viết tắt là ca gờ. Bao gạo nặng năm ki lô gam. Quả dưa nặng hai ki lô gam. Bao gạo nặng hơn quả dưa."

