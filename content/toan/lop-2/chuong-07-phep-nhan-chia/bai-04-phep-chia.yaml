      🍬🍬🍬🍬🍬🍬 chia đều cho 2 bạn, mỗi bạn được 3 cái.

      Ta viết: **6 : 2 = 3**.

      Đọc là: sáu **chia** hai bằng ba.
    say: "Sáu cái kẹo chia đều cho hai bạn, mỗi bạn được ba cái. Sáu chia hai bằng ba."

