    markdown: |
      🍊🍊 🍊🍊 🍊🍊

      2 + 2 + 2 = 6. Ta viết: **2 × 3 = 6**.

      Đọc là: hai **nhân** ba bằng sáu.
    say: "Hai cộng hai cộng hai bằng sáu. Ta viết hai nhân ba bằng sáu."

