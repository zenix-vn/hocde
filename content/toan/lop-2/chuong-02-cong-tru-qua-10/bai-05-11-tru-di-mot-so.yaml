  - id: b2
    type: "text"
    markdown: |
      **13 − 5 = ?**

      Tách 13 = 10 + 3. Lấy 10 − 5 = 5. Rồi 5 + 3 = **8**.

      Hoặc: 13 − 3 = 10, rồi 10 − 2 = **8**.
    say: "Mười ba trừ năm. Tách mười ba bằng mười cộng ba. Mười trừ năm bằng năm, năm cộng ba bằng tám."

  - id: b3
    type: "callout"
    variant: "tip"
    markdown: "Kiểm tra bằng phép cộng: nếu 13 − 5 = 8 thì 8 + 5 = 13."
    say: "Kiểm tra bằng phép cộng. Nếu mười ba trừ năm bằng tám thì tám cộng năm bằng mười ba."

