    text: "Mẹo hay đây: muốn cộng 9, bé cho đủ 10 trước!"

  - id: b2
    type: "text"
    markdown: |
      **9 + 4 = ?**

      Lấy 1 từ số 4 sang số 9 cho đủ 10: 9 + 1 = 10. Còn lại 3.

      10 + 3 = **13**. Vậy 9 + 4 = 13.
    say: "Chín cộng bốn. Lấy một từ số bốn sang số chín cho đủ mười. Còn lại ba. Mười cộng ba bằng mười ba."

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **9 + một số** = 10 + (số đó − 1)

      9 + 5 = 14, 9 + 6 = 15, 9 + 7 = 16.
    say: "Chín cộng một số bằng mười cộng số đó bớt một."

