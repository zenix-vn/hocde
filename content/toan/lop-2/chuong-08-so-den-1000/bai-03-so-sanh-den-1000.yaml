      **456** và **432**: trăm bằng nhau (4), chục: 5 > 3. Nên **456 > 432**.

      **289** và **301**: 2 trăm < 3 trăm. Nên **289 < 301**.
    say: "Bốn trăm năm mươi sáu lớn hơn bốn trăm ba mươi hai. Hai trăm tám mươi chín bé hơn ba trăm linh một."

