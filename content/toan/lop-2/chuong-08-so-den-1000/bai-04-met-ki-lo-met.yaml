blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Đi học xa gần đo bằng ki-lô-mét. Cái bàn dài đo bằng mét!"

  - id: b2
    type: "text"
    markdown: |
      **1 m = 100 cm**

      **1 km = 1000 m**

      **1 cm = 10 mm**

      Chiều dài cái bàn khoảng 1 m. Đường từ nhà đến trường có thể dài 2 km.
    say: "Một mét bằng một trăm xăng ti mét. Một ki lô mét bằng một nghìn mét. Một xăng ti mét bằng mười mi li mét."

  - id: b3
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "don-vi-do"
    prompt: "1 m = _ cm"
    answer: { accept: ["100"] }
    hint: "Một mét dài hơn một đề-xi-mét rất nhiều."
    explanation: "1 m = 100 cm."

  - id: b4
    type: "exercise"
