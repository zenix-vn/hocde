    markdown: |
      **52 − 27 = ?**

      Đơn vị: 2 không trừ được 7, lấy 12 − 7 = **5**, nhớ **1**.

      Chục: 5 − (2 + 1) = 2.

      Vậy 52 − 27 = **25**.
    say: "Năm mươi hai trừ hai mươi bảy. Hai không trừ được bảy, lấy mười hai trừ bảy bằng năm, nhớ một. Chục: năm trừ ba bằng hai. Vậy bằng hai mươi lăm."

