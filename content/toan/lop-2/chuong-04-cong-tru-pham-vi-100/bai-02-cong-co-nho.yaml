      Đơn vị: 8 + 7 = 15, viết **5**, nhớ **1**.

      Chục: 3 + 2 = 5, thêm 1 là 6.

      Vậy 38 + 27 = **65**.
    say: "Ba mươi tám cộng hai mươi bảy. Đơn vị: tám cộng bảy bằng mười lăm, viết năm nhớ một. Chục: ba cộng hai bằng năm, thêm một là sáu. Vậy bằng sáu mươi lăm."

