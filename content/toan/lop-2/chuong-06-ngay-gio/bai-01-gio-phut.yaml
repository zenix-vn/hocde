      Kim dài chỉ số **12** là giờ đúng: 3 giờ.

      Kim dài chỉ số **3** là **15 phút**. Kim dài chỉ số **6** là **30 phút** (rưỡi).

      **1 giờ = 60 phút**.
    say: "Kim dài chỉ số mười hai là giờ đúng. Kim dài chỉ số ba là mười lăm phút. Kim dài chỉ số sáu là ba mươi phút. Một giờ bằng sáu mươi phút."

