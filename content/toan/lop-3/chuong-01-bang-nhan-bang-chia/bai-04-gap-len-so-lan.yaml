blocks:
  - id: b1
    type: "text"
    markdown: |
      **Gấp 4 lần số 5:** 5 × 4 = 20.

      **Giảm 4 lần số 20:** 20 : 4 = 5.

      **20 gấp mấy lần 5?** 20 : 5 = 4 (lần).

