blocks:
  - id: b1
    type: "text"
    markdown: |
      Góc vuông là góc ở các đỉnh của **hình chữ nhật** và **hình vuông**. Em dùng **ê ke** để kiểm tra góc vuông.

      Góc **không vuông** là góc nhỏ hơn hoặc lớn hơn góc vuông.

  - id: b2
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "goc-vuong"
    prompt: "Hình chữ nhật có mấy góc vuông?"
    options:
      - { id: "a", text: "2" }
      - { id: "b", text: "3" }
      - { id: "c", text: "4" }
    answer: { correct: ["c"] }
    hint: "Các góc của hình chữ nhật đều vuông."
    explanation: "Hình chữ nhật có 4 góc vuông."

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "goc-vuong"
    prompt: "Dụng cụ dùng để kiểm tra góc vuông là:"
    options:
      - { id: "a", text: "ê ke" }
      - { id: "b", text: "compa" }
      - { id: "c", text: "cân" }
    answer: { correct: ["a"] }
    hint: "Có một góc vuông."
    explanation: "Dùng ê ke."

  - id: b4
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "goc-vuong"
    prompt: "Hình tam giác thường có bao nhiêu góc vuông nhất?"
