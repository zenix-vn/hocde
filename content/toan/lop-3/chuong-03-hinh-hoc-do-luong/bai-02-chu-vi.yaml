    type: "text"
    markdown: |
      **Chu vi** là tổng độ dài các cạnh.

      **Hình chữ nhật:** (chiều dài + chiều rộng) × 2

      **Hình vuông:** cạnh × 4

  - id: b2
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "chu-vi-hcn"
    prompt: "Hình chữ nhật có chiều dài 8 cm, chiều rộng 5 cm. Chu vi là _ cm."
    answer: { accept: ["26"] }
    hint: "(8 + 5) × 2."
    explanation: "(8 + 5) × 2 = 26."

