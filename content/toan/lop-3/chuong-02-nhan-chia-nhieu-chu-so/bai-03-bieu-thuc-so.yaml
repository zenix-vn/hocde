    markdown: |
      **Quy tắc:**

      - Có nhân, chia và cộng, trừ: tính **nhân, chia trước**, cộng, trừ sau.

      - Có dấu ngoặc ( ): tính **trong ngoặc trước**.

      5 + 3 × 4 = 5 + 12 = 17

      (5 + 3) × 4 = 8 × 4 = 32

