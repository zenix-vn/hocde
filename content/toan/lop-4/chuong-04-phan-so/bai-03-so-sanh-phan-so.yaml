  - id: b1
    type: "text"
    markdown: |
      **Cùng mẫu số:** tử số nào lớn hơn thì phân số lớn hơn. 5/7 > 3/7.

      **Khác mẫu số:** quy đồng rồi so sánh. 1/2 và 2/3 → 3/6 và 4/6, nên 1/2 < 2/3.

      **Cùng tử số:** mẫu số nào bé hơn thì phân số lớn hơn.

