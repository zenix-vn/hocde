    type: "text"
    markdown: |
      **Rút gọn:** chia cả tử và mẫu cho cùng một số lớn hơn 1.

      6/8 = (6 : 2)/(8 : 2) = **3/4**

      **Quy đồng mẫu số:** 1/2 và 1/3 → 3/6 và 2/6.

