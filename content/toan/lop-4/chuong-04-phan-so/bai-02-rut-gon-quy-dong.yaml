    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "rut-gon"
    prompt: "Rút gọn 6/8 được phân số tối giản:"
    options:
      - { id: "a", text: "3/4" }
      - { id: "b", text: "4/4" }
      - { id: "c", text: "3/8" }
    answer: { correct: ["a"] }
    hint: "Chia cả tử và mẫu cho 2."
    explanation: "6/8 = 3/4."

