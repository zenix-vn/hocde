blocks:
  - id: b1
    type: "text"
    markdown: |
      **Cùng mẫu:** cộng (trừ) tử số, giữ nguyên mẫu số.

      2/7 + 3/7 = 5/7 · 5/6 − 1/6 = 4/6 = 2/3

      **Khác mẫu:** quy đồng rồi tính. 1/2 + 1/3 = 3/6 + 2/6 = 5/6.

  - id: b2
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "cong-ps"
    prompt: "2/9 + 4/9 = ?"
    options:
      - { id: "a", text: "6/9" }
      - { id: "b", text: "6/18" }
      - { id: "c", text: "2/9" }
    answer: { correct: ["a"] }
    hint: "Cộng tử, giữ mẫu."
    explanation: "6/9 = 2/3."

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tru-ps"
    prompt: "7/8 − 3/8 = ?"
