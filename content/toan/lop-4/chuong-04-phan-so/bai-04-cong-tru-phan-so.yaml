      - { id: "a", text: "10/8" }
      - { id: "b", text: "4/8" }
      - { id: "c", text: "4/16" }
    answer: { correct: ["b"] }
    hint: "Trừ tử, giữ mẫu."
    explanation: "4/8 = 1/2."

  - id: b4
