blocks:
  - id: b1
    type: "text"
    markdown: |
      **So sánh:** số nào có nhiều chữ số hơn thì lớn hơn. Cùng số chữ số, so từng hàng từ trái sang.

      **Làm tròn:** chữ số bên phải **≥ 5** thì làm tròn lên, **< 5** thì giữ nguyên.

      7 352 làm tròn đến hàng trăm là 7 400.

