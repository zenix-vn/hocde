    markdown: |
      Các hàng: đơn vị, chục, trăm | nghìn, chục nghìn, trăm nghìn | triệu, chục triệu, trăm triệu.

      Mỗi **lớp** có 3 hàng: lớp đơn vị, lớp nghìn, lớp triệu.

      **3 425 618** đọc là: ba triệu bốn trăm hai mươi lăm nghìn sáu trăm mười tám.

