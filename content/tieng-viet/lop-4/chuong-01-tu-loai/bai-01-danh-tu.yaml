    markdown: |
      **Danh từ** là từ chỉ người, vật, hiện tượng, khái niệm, đơn vị.

      - Người: **học sinh, bác sĩ**
      - Vật: **bàn, núi**
      - Hiện tượng: **mưa, gió**
      - Đơn vị: **con, cái, chiếc, bó**

