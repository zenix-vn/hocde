      - **Câu hỏi:** dùng để hỏi (dấu chấm hỏi).
      - **Câu khiến:** nhờ, yêu cầu (dấu chấm hoặc dấu chấm than).
      - **Câu cảm:** bày tỏ cảm xúc (dấu chấm than).

