    options:
      - {"id": "a", "text": "hổ"}
      - {"id": "b", "text": "lá"}
      - {"id": "c", "text": "nô"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"nô\"."

