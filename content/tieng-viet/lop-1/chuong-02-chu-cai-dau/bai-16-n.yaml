      onset: "n"
      rhyme: "ô"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép n + ô rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "nơ", "emoji": "🎀"}
        - {"word": "nón", "emoji": "👒"}
        - {"word": "nô", "emoji": "🧸"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ n."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **nơ**, **nón**, **nô** đều có chữ **n**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-n"
    prompt: "Tiếng nào bắt đầu bằng chữ **n**?"
    options:
      - {"id": "a", "text": "sò"}
      - {"id": "b", "text": "sao"}
      - {"id": "c", "text": "nơ"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"nơ\" bắt đầu bằng chữ n."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-n"
    prompt: "Hình 👒 là tiếng nào?"
