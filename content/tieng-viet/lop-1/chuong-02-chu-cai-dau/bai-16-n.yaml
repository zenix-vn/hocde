      - {"id": "a", "text": "gà"}
      - {"id": "b", "text": "nón"}
      - {"id": "c", "text": "tôm"}
    answer: {"correct": ["b"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 👒 là \"nón\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-n"
    prompt: "Nghe và chọn tiếng bé nghe được:"
