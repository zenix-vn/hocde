    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ n. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **N** có hai dạng: **N** in hoa, **n** in thường.
      Âm **n** đọc là "nờ".

  - id: "b3"
    type: "interactive"
