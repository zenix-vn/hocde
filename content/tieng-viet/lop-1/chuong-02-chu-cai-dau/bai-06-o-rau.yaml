schema: 1
slug: tv1-bai-06-o-rau
title: "Chữ Ơ ơ"
summary: "Làm quen chữ Ơ, ơ; nhận biết âm ơ trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ ơ. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **Ơ** có hai dạng: **Ơ** in hoa, **ơ** in thường.
      Âm **ơ** đọc là "ơ" (miệng mở vừa, môi không tròn).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "b"
      rhyme: "ơ"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ơ rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **bờ**, **cờ**, **bơ** đều có âm **ơ**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-o-rau
    prompt: "Đâu là chữ **ơ** in thường?"
    options:
      - { id: a, text: "ơ" }
      - { id: b, text: "o" }
      - { id: c, text: "ô" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ ơ in thường là \"ơ\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-o-rau
    prompt: "Tiếng nào có âm **ơ**?"
    options:
      - { id: a, text: "bờ" }
      - { id: b, text: "bò" }
      - { id: c, text: "bố" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"ơ\" không."
    explanation: "Tiếng \"bờ\" có âm \"ơ\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-o-rau
    prompt: "Điền phần còn thiếu để được tiếng **cờ**: c_"
    answer: { accept: ["ờ", "ơ"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "c + ờ = cờ."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **Ơ ơ** và đọc được: bờ, cờ, bơ. Giỏi quá!"
