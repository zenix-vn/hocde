schema: 1
slug: tv1-bai-07-d
title: "Chữ D d"
summary: "Làm quen chữ D, d; nhận biết âm d trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ d. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **D** có hai dạng: **D** in hoa, **d** in thường.
      Âm **d** đọc là "dờ" (đầu lưỡi chạm răng trên).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "d"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép d + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **da**, **dạ**, **dò** đều có âm **d**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-d
    prompt: "Đâu là chữ **d** in thường?"
    options:
      - { id: a, text: "d" }
      - { id: b, text: "đ" }
      - { id: c, text: "b" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ d in thường là \"d\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-d
    prompt: "Tiếng nào có âm **d**?"
    options:
      - { id: a, text: "dạ" }
      - { id: b, text: "ba" }
      - { id: c, text: "cá" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"d\" không."
    explanation: "Tiếng \"dạ\" có âm \"d\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-d
    prompt: "Điền phần còn thiếu để được tiếng **da**: d_"
    answer: { accept: ["a"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "d + a = da."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **D d** và đọc được: da, dạ, dò. Giỏi quá!"
