schema: 1
slug: tv1-bai-05-o-mu
title: "Chữ Ô ô"
summary: "Làm quen chữ Ô, ô; nhận biết âm ô trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ ô. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **Ô** có hai dạng: **Ô** in hoa, **ô** in thường.
      Âm **ô** đọc là "ô" (miệng tròn, môi chu ra).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "b"
      rhyme: "ô"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ô rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **bố**, **cô**, **cổ** đều có âm **ô**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-o-mu
    prompt: "Đâu là chữ **ô** in thường?"
    options:
      - { id: a, text: "ô" }
      - { id: b, text: "o" }
      - { id: c, text: "ơ" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ ô in thường là \"ô\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-o-mu
    prompt: "Tiếng nào có âm **ô**?"
    options:
      - { id: a, text: "bố" }
      - { id: b, text: "bo" }
      - { id: c, text: "ba" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"ô\" không."
    explanation: "Tiếng \"bố\" có âm \"ô\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-o-mu
    prompt: "Điền phần còn thiếu để được tiếng **cô**: c_"
    answer: { accept: ["ô"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "c + ô = cô."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **Ô ô** và đọc được: bố, cô, cổ. Giỏi quá!"
