      onset: "g"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép g + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "gà", "emoji": "🐔"}
        - {"word": "gỗ", "emoji": "🪵"}
        - {"word": "gạo", "emoji": "🍚"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ g."
  - {"id": "b5", "type": "callout", "variant": "tip", "markdown": "Chữ **g** đứng trước **a, o, ô, ơ, u, ư**: gà, gỗ, gạo.", "say": null}

