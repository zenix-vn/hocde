      - {"id": "b", "text": "bút"}
      - {"id": "c", "text": "gà"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"gà\" bắt đầu bằng chữ g."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
