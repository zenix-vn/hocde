      - {"id": "b", "text": "pin"}
      - {"id": "c", "text": "tôm"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🪵 là \"gỗ\"."

