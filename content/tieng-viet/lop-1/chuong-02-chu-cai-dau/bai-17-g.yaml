    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ g. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **G** có hai dạng: **G** in hoa, **g** in thường.
      Âm **g** đọc là "gờ".

  - id: "b3"
    type: "interactive"
