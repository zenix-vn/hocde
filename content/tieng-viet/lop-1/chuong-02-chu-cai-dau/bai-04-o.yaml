schema: 1
slug: tv1-bai-04-o
title: "Chữ O o"
summary: "Làm quen chữ O, o; nhận biết âm o trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ o. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **O** có hai dạng: **O** in hoa, **o** in thường.
      Âm **o** đọc là "o" (miệng tròn).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "b"
      rhyme: "o"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + o rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **bò**, **cò**, **có** đều có âm **o**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-o
    prompt: "Đâu là chữ **o** in thường?"
    options:
      - { id: a, text: "o" }
      - { id: b, text: "ô" }
      - { id: c, text: "a" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ o in thường là \"o\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-o
    prompt: "Tiếng nào có âm **o**?"
    options:
      - { id: a, text: "bò" }
      - { id: b, text: "ba" }
      - { id: c, text: "ca" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"o\" không."
    explanation: "Tiếng \"bò\" có âm \"o\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-o
    prompt: "Điền phần còn thiếu để được tiếng **bò**: b_"
    answer: { accept: ["o", "ò"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "b + ò = bò."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **O o** và đọc được: bò, cò, có. Giỏi quá!"
