schema: 1
slug: "tv1-bai-25-x"
title: "Chữ X x"
summary: "Làm quen chữ X, x; nhận biết âm x trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ x. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **X** có hai dạng: **X** in hoa, **x** in thường.
      Âm **x** đọc là "xờ".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "x"
      rhyme: "e"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép x + e rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "xe", "emoji": "🚗"}
        - {"word": "xô", "emoji": "🪣"}
        - {"word": "xương", "emoji": "🦴"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ x."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **xe**, **xô**, **xương** đều có chữ **x**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-x"
    prompt: "Tiếng nào bắt đầu bằng chữ **x**?"
    options:
      - {"id": "a", "text": "cờ"}
      - {"id": "b", "text": "voi"}
      - {"id": "c", "text": "xe"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"xe\" bắt đầu bằng chữ x."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-x"
    prompt: "Hình 🪣 là tiếng nào?"
    options:
      - {"id": "a", "text": "xô"}
      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "mẹ"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🪣 là \"xô\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-x"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "xương"}
    options:
      - {"id": "a", "text": "xương"}
      - {"id": "b", "text": "cua"}
      - {"id": "c", "text": "voi"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"xương\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-xe"
    prompt: "Sắp xếp để tạo thành tiếng **xe**:"
    options:
      - {"id": "x1", "text": "x"}
      - {"id": "x2", "text": "e"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "x + e = xe."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-x"
    prompt: "Điền chữ còn thiếu để được tiếng **xe**: _e"
    answer: {"accept": ["x"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "x + e = xe."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-x"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🚗", "right": "xe"}
      - {"left": "🪣", "right": "xô"}
      - {"left": "🦴", "right": "xương"}
    answer: {"pairs": [["🚗", "xe"], ["🪣", "xô"], ["🦴", "xương"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **X x** và đọc được: xe, xô, xương. Giỏi quá!", "say": null}
