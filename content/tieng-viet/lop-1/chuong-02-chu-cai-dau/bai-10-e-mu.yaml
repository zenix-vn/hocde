schema: 1
slug: tv1-bai-10-e-mu
title: "Chữ Ê ê"
summary: "Làm quen chữ Ê, ê; nhận biết âm ê trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ ê. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **Ê** có hai dạng: **Ê** in hoa, **ê** in thường.
      Âm **ê** đọc là "ê" (miệng mở hẹp hơn chữ e).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "b"
      rhyme: "ê"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ê rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **bê**, **dê**, **đê** đều có âm **ê**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-e-mu
    prompt: "Đâu là chữ **ê** in thường?"
    options:
      - { id: a, text: "ê" }
      - { id: b, text: "e" }
      - { id: c, text: "o" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ ê in thường là \"ê\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-e-mu
    prompt: "Tiếng nào có âm **ê**?"
    options:
      - { id: a, text: "dê" }
      - { id: b, text: "de" }
      - { id: c, text: "da" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"ê\" không."
    explanation: "Tiếng \"dê\" có âm \"ê\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-e-mu
    prompt: "Điền phần còn thiếu để được tiếng **dê**: d_"
    answer: { accept: ["ê"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "d + ê = dê."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **Ê ê** và đọc được: bê, dê, đê. Giỏi quá!"
