      onset: "qu"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép qu + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "quà", "emoji": "🎁"}
        - {"word": "quê", "emoji": "🏡"}
        - {"word": "quạ", "emoji": "🐦"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ qu."

  - id: "b5"
    type: "callout"
    variant: "tip"
    markdown: "Chữ **q** luôn đi cùng **u** thành **qu** (quờ): quà, quê, quạ."
    say: "Chữ q luôn đi cùng u thành quờ (quờ): quà, quê, quạ."

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-qu"
    prompt: "Tiếng nào bắt đầu bằng chữ **qu**?"
    say: "Tiếng nào bắt đầu bằng chữ quờ?"
    options:
      - {"id": "a", "text": "bò"}
      - {"id": "b", "text": "kem"}
      - {"id": "c", "text": "quà"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"quà\" bắt đầu bằng chữ qu."

  - id: "b7"
    type: "exercise"
