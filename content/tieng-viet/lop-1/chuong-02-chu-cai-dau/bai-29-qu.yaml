status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ qu. Bé nghe và đọc theo mình nhé!"
    say: "Hôm nay mình học chữ mới: chữ quờ. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Qu** có hai dạng: **Qu** in hoa, **qu** in thường.
      Âm **qu** đọc là "quờ".
    say: "Chữ Qu có hai dạng: Qu in hoa, quờ in thường.. Âm quờ đọc là \"quờ\"."

  - id: "b3"
    type: "interactive"
