    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b12"
    type: "summary"
    markdown: "Hôm nay bé biết chữ **Qu qu** và đọc được: quà, quê, quạ. Giỏi quá!"
    say: "Hôm nay bé biết chữ quờ và đọc được: quà, quê, quạ. Giỏi quá!"
