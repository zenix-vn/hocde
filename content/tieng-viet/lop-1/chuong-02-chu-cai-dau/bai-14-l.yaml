schema: 1
slug: "tv1-bai-14-l"
title: "Chữ L l"
summary: "Làm quen chữ L, l; nhận biết âm l trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ l. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **L** có hai dạng: **L** in hoa, **l** in thường.
      Âm **l** đọc là "lờ".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "l"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép l + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "lá", "emoji": "🍃"}
        - {"word": "lê", "emoji": "🍐"}
        - {"word": "lọ", "emoji": "🏺"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ l."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **lá**, **lê**, **lọ** đều có chữ **l**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-l"
    prompt: "Tiếng nào bắt đầu bằng chữ **l**?"
    options:
      - {"id": "a", "text": "lá"}
      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "mơ"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"lá\" bắt đầu bằng chữ l."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-l"
    prompt: "Hình 🍐 là tiếng nào?"
    options:
      - {"id": "a", "text": "ghế"}
      - {"id": "b", "text": "lê"}
      - {"id": "c", "text": "dê"}
    answer: {"correct": ["b"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🍐 là \"lê\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-l"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "lọ"}
    options:
      - {"id": "a", "text": "mèo"}
      - {"id": "b", "text": "bò"}
      - {"id": "c", "text": "lọ"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"lọ\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-la"
    prompt: "Sắp xếp để tạo thành tiếng **lá**:"
    options:
      - {"id": "x2", "text": "á"}
      - {"id": "x1", "text": "l"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "l + á = lá."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-l"
    prompt: "Điền chữ còn thiếu để được tiếng **lá**: _á"
    answer: {"accept": ["l"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "l + á = lá."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-l"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🍃", "right": "lá"}
      - {"left": "🍐", "right": "lê"}
      - {"left": "🏺", "right": "lọ"}
    answer: {"pairs": [["🍃", "lá"], ["🍐", "lê"], ["🏺", "lọ"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **L l** và đọc được: lá, lê, lọ. Giỏi quá!", "say": null}
