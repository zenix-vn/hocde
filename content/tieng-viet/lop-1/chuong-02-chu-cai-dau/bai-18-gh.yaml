schema: 1
slug: "tv1-bai-18-gh"
title: "Chữ Gh gh"
summary: "Làm quen chữ Gh, gh; nhận biết âm gh trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ gh. Bé nghe và đọc theo mình nhé!"
    say: "Hôm nay mình học chữ mới: chữ gờ. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Gh** có hai dạng: **Gh** in hoa, **gh** in thường.
      Âm **gh** đọc là "gờ".
    say: "Chữ Gh có hai dạng: Gh in hoa, gờ in thường.. Âm gờ đọc là \"gờ\"."

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "gh"
      rhyme: "e"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép gh + e rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "ghế", "emoji": "🪑"}
        - {"word": "ghe", "emoji": "🛶"}
        - {"word": "ghi", "emoji": "✏️"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ gh."

  - id: "b5"
    type: "callout"
    variant: "tip"
    markdown: "**gh** (gờ kép) chỉ đứng trước **i, e, ê**: ghi, ghế, ghe. Trước các chữ khác ta viết **g**: gà, gỗ."
    say: "gờ (gờ kép) chỉ đứng trước i, e, ê: ghi, ghế, ghe. Trước các chữ khác ta viết g: gà, gỗ."

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-gh"
    prompt: "Tiếng nào bắt đầu bằng chữ **gh**?"
    say: "Tiếng nào bắt đầu bằng chữ gờ?"
    options:
      - {"id": "a", "text": "rổ"}
      - {"id": "b", "text": "ghế"}
      - {"id": "c", "text": "nón"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"ghế\" bắt đầu bằng chữ gh."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-gh"
    prompt: "Hình 🛶 là tiếng nào?"
    options:
      - {"id": "a", "text": "ghe"}
      - {"id": "b", "text": "na"}
      - {"id": "c", "text": "cờ"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🛶 là \"ghe\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-gh"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "ghi"}
    options:
      - {"id": "a", "text": "rùa"}
      - {"id": "b", "text": "nhà"}
      - {"id": "c", "text": "ghi"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"ghi\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-ghee"
    prompt: "Sắp xếp để tạo thành tiếng **ghế**:"
    options:
      - {"id": "x2", "text": "ế"}
      - {"id": "x1", "text": "gh", "say": "gờ"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "gh + ế = ghế."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-gh"
    prompt: "Điền chữ còn thiếu để được tiếng **ghế**: _ế"
    answer: {"accept": ["gh"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "gh + ế = ghế."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-gh"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🪑", "right": "ghế"}
      - {"left": "🛶", "right": "ghe"}
      - {"left": "✏️", "right": "ghi"}
    answer: {"pairs": [["🪑", "ghế"], ["🛶", "ghe"], ["✏️", "ghi"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b12"
    type: "summary"
    markdown: "Hôm nay bé biết chữ **Gh gh** và đọc được: ghế, ghe, ghi. Giỏi quá!"
    say: "Hôm nay bé biết chữ gờ và đọc được: ghế, ghe, ghi. Giỏi quá!"
