schema: 1
slug: "tv1-bai-13-k"
title: "Chữ K k"
summary: "Làm quen chữ K, k; nhận biết âm k trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ k. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **K** có hai dạng: **K** in hoa, **k** in thường.
      Âm **k** đọc là "ca".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "k"
      rhyme: "e"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép k + e rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "kẹo", "emoji": "🍬"}
        - {"word": "kem", "emoji": "🍦"}
        - {"word": "kể", "emoji": "🗣️"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ k."

  - id: "b5"
    type: "callout"
    variant: "tip"
    markdown: "Chữ **k** (ca) chỉ đứng trước **i, e, ê**: kì, kem, kể. Trước các chữ khác ta viết **c**: cá, cô, cu."
    say: "Chữ k (ca) chỉ đứng trước i, e, ê: kì, kem, kể. Trước các chữ khác ta viết c: cá, cô, cu."

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-k"
    prompt: "Tiếng nào bắt đầu bằng chữ **k**?"
    options:
      - {"id": "a", "text": "mẹ"}
      - {"id": "b", "text": "vở"}
      - {"id": "c", "text": "kẹo"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"kẹo\" bắt đầu bằng chữ k."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-k"
    prompt: "Hình 🍦 là tiếng nào?"
    options:
      - {"id": "a", "text": "kem"}
      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "tôm"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🍦 là \"kem\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-k"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "kể"}
    options:
      - {"id": "a", "text": "trâu"}
      - {"id": "b", "text": "kể"}
      - {"id": "c", "text": "lá"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"kể\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-keo"
    prompt: "Sắp xếp để tạo thành tiếng **kẹo**:"
    options:
      - {"id": "x2", "text": "ẹo"}
      - {"id": "x1", "text": "k"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "k + ẹo = kẹo."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-k"
    prompt: "Điền chữ còn thiếu để được tiếng **kẹo**: _ẹo"
    answer: {"accept": ["k"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "k + ẹo = kẹo."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-k"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🍬", "right": "kẹo"}
      - {"left": "🍦", "right": "kem"}
      - {"left": "🗣️", "right": "kể"}
    answer: {"pairs": [["🍬", "kẹo"], ["🍦", "kem"], ["🗣️", "kể"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **K k** và đọc được: kẹo, kem, kể. Giỏi quá!", "say": null}
