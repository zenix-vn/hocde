schema: 1
slug: "tv1-bai-24-v"
title: "Chữ V v"
summary: "Làm quen chữ V, v; nhận biết âm v trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ v. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **V** có hai dạng: **V** in hoa, **v** in thường.
      Âm **v** đọc là "vờ".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "v"
      rhyme: "e"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép v + e rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "vẽ", "emoji": "🎨"}
        - {"word": "vở", "emoji": "📓"}
        - {"word": "vịt", "emoji": "🦆"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ v."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **vẽ**, **vở**, **vịt** đều có chữ **v**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-v"
    prompt: "Tiếng nào bắt đầu bằng chữ **v**?"
    options:
      - {"id": "a", "text": "bố"}
      - {"id": "b", "text": "hoa"}
      - {"id": "c", "text": "vẽ"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"vẽ\" bắt đầu bằng chữ v."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-v"
    prompt: "Hình 📓 là tiếng nào?"
    options:
      - {"id": "a", "text": "vở"}
      - {"id": "b", "text": "sò"}
      - {"id": "c", "text": "sách"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 📓 là \"vở\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-v"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "vịt"}
    options:
      - {"id": "a", "text": "vịt"}
      - {"id": "b", "text": "dê"}
      - {"id": "c", "text": "nơ"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"vịt\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-ve"
    prompt: "Sắp xếp để tạo thành tiếng **vẽ**:"
    options:
      - {"id": "x2", "text": "ẽ"}
      - {"id": "x1", "text": "v"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "v + ẽ = vẽ."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-v"
    prompt: "Điền chữ còn thiếu để được tiếng **vẽ**: _ẽ"
    answer: {"accept": ["v"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "v + ẽ = vẽ."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-v"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🎨", "right": "vẽ"}
      - {"left": "📓", "right": "vở"}
      - {"left": "🦆", "right": "vịt"}
    answer: {"pairs": [["🎨", "vẽ"], ["📓", "vở"], ["🦆", "vịt"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **V v** và đọc được: vẽ, vở, vịt. Giỏi quá!", "say": null}
