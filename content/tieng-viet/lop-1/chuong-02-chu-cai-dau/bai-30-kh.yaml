schema: 1
slug: "tv1-bai-30-kh"
title: "Chữ Kh kh"
summary: "Làm quen chữ Kh, kh; nhận biết âm kh trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ kh. Bé nghe và đọc theo mình nhé!"
    say: "Hôm nay mình học chữ mới: chữ khờ. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Kh** có hai dạng: **Kh** in hoa, **kh** in thường.
      Âm **kh** đọc là "khờ".
    say: "Chữ Kh có hai dạng: Kh in hoa, khờ in thường.. Âm khờ đọc là \"khờ\"."

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "kh"
      rhyme: "i"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép kh + i rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "khỉ", "emoji": "🐒"}
        - {"word": "khế", "emoji": "⭐"}
        - {"word": "khăn", "emoji": "🧣"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ kh."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **khỉ**, **khế**, **khăn** đều có chữ **kh**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-kh"
    prompt: "Tiếng nào bắt đầu bằng chữ **kh**?"
    say: "Tiếng nào bắt đầu bằng chữ khờ?"
    options:
      - {"id": "a", "text": "voi"}
      - {"id": "b", "text": "khỉ"}
      - {"id": "c", "text": "mèo"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"khỉ\" bắt đầu bằng chữ kh."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-kh"
    prompt: "Hình ⭐ là tiếng nào?"
    options:
      - {"id": "a", "text": "khế"}
      - {"id": "b", "text": "nón"}
      - {"id": "c", "text": "ong"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình ⭐ là \"khế\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-kh"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "khăn"}
    options:
      - {"id": "a", "text": "khăn"}
      - {"id": "b", "text": "sách"}
      - {"id": "c", "text": "ong"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"khăn\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-khi"
    prompt: "Sắp xếp để tạo thành tiếng **khỉ**:"
    options:
      - {"id": "x2", "text": "ỉ"}
      - {"id": "x1", "text": "kh", "say": "khờ"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "kh + ỉ = khỉ."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-kh"
    prompt: "Điền chữ còn thiếu để được tiếng **khỉ**: _ỉ"
    answer: {"accept": ["kh"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "kh + ỉ = khỉ."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-kh"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🐒", "right": "khỉ"}
      - {"left": "⭐", "right": "khế"}
      - {"left": "🧣", "right": "khăn"}
    answer: {"pairs": [["🐒", "khỉ"], ["⭐", "khế"], ["🧣", "khăn"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b12"
    type: "summary"
    markdown: "Hôm nay bé biết chữ **Kh kh** và đọc được: khỉ, khế, khăn. Giỏi quá!"
    say: "Hôm nay bé biết chữ khờ và đọc được: khỉ, khế, khăn. Giỏi quá!"
