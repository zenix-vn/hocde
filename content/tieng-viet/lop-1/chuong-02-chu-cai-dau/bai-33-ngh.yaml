schema: 1
slug: "tv1-bai-33-ngh"
title: "Chữ Ngh ngh"
summary: "Làm quen chữ Ngh, ngh; nhận biết âm ngh trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ ngh. Bé nghe và đọc theo mình nhé!"
    say: "Hôm nay mình học chữ mới: chữ ngờ. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Ngh** có hai dạng: **Ngh** in hoa, **ngh** in thường.
      Âm **ngh** đọc là "ngờ".
    say: "Chữ Ngh có hai dạng: Ngh in hoa, ngờ in thường.. Âm ngờ đọc là \"ngờ\"."

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "ngh"
      rhyme: "e"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép ngh + e rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "nghe", "emoji": "👂"}
        - {"word": "nghé", "emoji": "🐃"}
        - {"word": "nghỉ", "emoji": "🛌"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ ngh."

  - id: "b5"
    type: "callout"
    variant: "tip"
    markdown: "**ngh** (ngờ kép) chỉ đứng trước **i, e, ê**: nghe, nghé, nghỉ."
    say: "ngờ (ngờ kép) chỉ đứng trước i, e, ê: nghe, nghé, nghỉ."

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-ngh"
    prompt: "Tiếng nào bắt đầu bằng chữ **ngh**?"
    say: "Tiếng nào bắt đầu bằng chữ ngờ?"
    options:
      - {"id": "a", "text": "na"}
      - {"id": "b", "text": "nghe"}
      - {"id": "c", "text": "bò"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"nghe\" bắt đầu bằng chữ ngh."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-ngh"
    prompt: "Hình 🐃 là tiếng nào?"
    options:
      - {"id": "a", "text": "bóng"}
      - {"id": "b", "text": "nghé"}
      - {"id": "c", "text": "tôm"}
    answer: {"correct": ["b"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🐃 là \"nghé\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-ngh"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "nghỉ"}
    options:
      - {"id": "a", "text": "nghỉ"}
      - {"id": "b", "text": "mưa"}
      - {"id": "c", "text": "gà"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"nghỉ\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-nghe"
    prompt: "Sắp xếp để tạo thành tiếng **nghe**:"
    options:
      - {"id": "x2", "text": "e"}
      - {"id": "x1", "text": "ngh", "say": "ngờ"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "ngh + e = nghe."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-ngh"
    prompt: "Điền chữ còn thiếu để được tiếng **nghe**: _e"
    answer: {"accept": ["ngh"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "ngh + e = nghe."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-ngh"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "👂", "right": "nghe"}
      - {"left": "🐃", "right": "nghé"}
      - {"left": "🛌", "right": "nghỉ"}
    answer: {"pairs": [["👂", "nghe"], ["🐃", "nghé"], ["🛌", "nghỉ"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b12"
    type: "summary"
    markdown: "Hôm nay bé biết chữ **Ngh ngh** và đọc được: nghe, nghé, nghỉ. Giỏi quá!"
    say: "Hôm nay bé biết chữ ngờ và đọc được: nghe, nghé, nghỉ. Giỏi quá!"
