  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Tr** có hai dạng: **Tr** in hoa, **tr** in thường.
      Âm **tr** đọc là "trờ".
    say: "Chữ Tr có hai dạng: Tr in hoa, trờ in thường.. Âm trờ đọc là \"trờ\"."

