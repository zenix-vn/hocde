schema: 1
slug: "tv1-bai-23-u-u"
title: "Chữ Ư ư"
summary: "Làm quen chữ Ư, ư; nhận biết âm ư trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ ư. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Ư** có hai dạng: **Ư** in hoa, **ư** in thường.
      Âm **ư** đọc là "ư".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "s"
      rhyme: "ư"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép s + ư rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "sư tử", "emoji": "🦁"}
        - {"word": "thư", "emoji": "✉️"}
        - {"word": "chữ", "emoji": "🔤"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ ư."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **sư tử**, **thư**, **chữ** đều có chữ **ư**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-u-u"
    prompt: "Tiếng nào có chữ **ư**?"
    options:
      - {"id": "a", "text": "kem"}
      - {"id": "b", "text": "gà"}
      - {"id": "c", "text": "sư tử"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"sư tử\" có chữ ư."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-u-u"
    prompt: "Hình ✉️ là tiếng nào?"
    options:
      - {"id": "a", "text": "trâu"}
      - {"id": "b", "text": "thư"}
      - {"id": "c", "text": "chim"}
    answer: {"correct": ["b"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình ✉️ là \"thư\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-u-u"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "chữ"}
    options:
      - {"id": "a", "text": "vịt"}
      - {"id": "b", "text": "chữ"}
      - {"id": "c", "text": "bi"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"chữ\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-suw"
    prompt: "Sắp xếp để tạo thành tiếng **sư**:"
    options:
      - {"id": "x2", "text": "ư"}
      - {"id": "x1", "text": "s"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "s + ư = sư."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-u-u"
    prompt: "Điền chữ còn thiếu để được tiếng **sư**: _ư"
    answer: {"accept": ["s"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "s + ư = sư."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-u-u"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🦁", "right": "sư tử"}
      - {"left": "✉️", "right": "thư"}
      - {"left": "🔤", "right": "chữ"}
    answer: {"pairs": [["🦁", "sư tử"], ["✉️", "thư"], ["🔤", "chữ"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **Ư ư** và đọc được: sư tử, thư, chữ. Giỏi quá!", "say": null}
