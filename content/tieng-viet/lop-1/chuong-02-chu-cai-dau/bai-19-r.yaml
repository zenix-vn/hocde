        - {"word": "rùa", "emoji": "🐢"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ r."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **rổ**, **rễ**, **rùa** đều có chữ **r**.", "say": null}

