    text: "Hôm nay mình học chữ mới: chữ r. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **R** có hai dạng: **R** in hoa, **r** in thường.
      Âm **r** đọc là "rờ".

