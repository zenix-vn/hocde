schema: 1
slug: tv1-bai-08-d-gach
title: "Chữ Đ đ"
summary: "Làm quen chữ Đ, đ; nhận biết âm đ trong tiếng."
est_minutes: 7
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học chữ mới: chữ đ. Bé nghe và đọc theo mình nhé!"

  - id: b2
    type: text
    markdown: |
      Chữ **Đ** có hai dạng: **Đ** in hoa, **đ** in thường.
      Âm **đ** đọc là "đờ" (đầu lưỡi cong lên, chạm lợi).

  - id: b3
    type: interactive
    kind: syllable_builder
    config:
      onset: "đ"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép đ + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: b4
    type: callout
    variant: remember
    markdown: "Tiếng **đò**, **đa**, **đô** đều có âm **đ**."

  - id: b5
    type: exercise
    kind: mcq
    points: 10
    skill: nhan-biet-chu-d-gach
    prompt: "Đâu là chữ **đ** in thường?"
    options:
      - { id: a, text: "đ" }
      - { id: b, text: "d" }
      - { id: c, text: "b" }
    answer: { correct: [a] }
    hint: "Nhìn kỹ hình dạng của chữ cần tìm."
    explanation: "Chữ đ in thường là \"đ\"."

  - id: b6
    type: exercise
    kind: mcq
    points: 10
    skill: tim-tieng-co-am-d-gach
    prompt: "Tiếng nào có âm **đ**?"
    options:
      - { id: a, text: "đò" }
      - { id: b, text: "dò" }
      - { id: c, text: "bò" }
    answer: { correct: [a] }
    hint: "Đọc to từng tiếng và nghe xem có âm \"đ\" không."
    explanation: "Tiếng \"đò\" có âm \"đ\"."

  - id: b7
    type: exercise
    kind: fill_blank
    points: 10
    skill: dien-chu-d-gach
    prompt: "Điền phần còn thiếu để được tiếng **đò**: đ_"
    answer: { accept: ["ò", "o"] }
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "đ + ò = đò."

  - id: b8
    type: summary
    markdown: "Hôm nay bé biết chữ **Đ đ** và đọc được: đò, đa, đô. Giỏi quá!"
