schema: 1
slug: "tv1-bai-32-ng"
title: "Chữ Ng ng"
summary: "Làm quen chữ Ng, ng; nhận biết âm ng trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ ng. Bé nghe và đọc theo mình nhé!"
    say: "Hôm nay mình học chữ mới: chữ ngờ. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **Ng** có hai dạng: **Ng** in hoa, **ng** in thường.
      Âm **ng** đọc là "ngờ".
    say: "Chữ Ng có hai dạng: Ng in hoa, ngờ in thường.. Âm ngờ đọc là \"ngờ\"."

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "ng"
      rhyme: "ô"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép ng + ô rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "ngô", "emoji": "🌽"}
        - {"word": "ngà", "emoji": "🦷"}
        - {"word": "ngủ", "emoji": "😴"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ ng."

  - id: "b5"
    type: "callout"
    variant: "tip"
    markdown: "**ng** đứng trước **a, o, ô, ơ, u, ư**: ngô, ngà, ngủ."
    say: "ngờ đứng trước a, o, ô, ơ, u, ư: ngô, ngà, ngủ."

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-ng"
    prompt: "Tiếng nào bắt đầu bằng chữ **ng**?"
    say: "Tiếng nào bắt đầu bằng chữ ngờ?"
    options:
      - {"id": "a", "text": "lọ"}
      - {"id": "b", "text": "ca"}
      - {"id": "c", "text": "ngô"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"ngô\" bắt đầu bằng chữ ng."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-ng"
    prompt: "Hình 🦷 là tiếng nào?"
    options:
      - {"id": "a", "text": "ngà"}
      - {"id": "b", "text": "cây"}
      - {"id": "c", "text": "lá"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🦷 là \"ngà\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-ng"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "ngủ"}
    options:
      - {"id": "a", "text": "dưa"}
      - {"id": "b", "text": "ngủ"}
      - {"id": "c", "text": "sò"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"ngủ\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-ngoo"
    prompt: "Sắp xếp để tạo thành tiếng **ngô**:"
    options:
      - {"id": "x2", "text": "ô"}
      - {"id": "x1", "text": "ng", "say": "ngờ"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "ng + ô = ngô."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-ng"
    prompt: "Điền chữ còn thiếu để được tiếng **ngô**: _ô"
    answer: {"accept": ["ng"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "ng + ô = ngô."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-ng"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🌽", "right": "ngô"}
      - {"left": "🦷", "right": "ngà"}
      - {"left": "😴", "right": "ngủ"}
    answer: {"pairs": [["🌽", "ngô"], ["🦷", "ngà"], ["😴", "ngủ"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b12"
    type: "summary"
    markdown: "Hôm nay bé biết chữ **Ng ng** và đọc được: ngô, ngà, ngủ. Giỏi quá!"
    say: "Hôm nay bé biết chữ ngờ và đọc được: ngô, ngà, ngủ. Giỏi quá!"
