schema: 1
slug: "tv1-bai-15-m"
title: "Chữ M m"
summary: "Làm quen chữ M, m; nhận biết âm m trong tiếng."
est_minutes: 7
xp_reward: 20
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ m. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **M** có hai dạng: **M** in hoa, **m** in thường.
      Âm **m** đọc là "mờ".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "m"
      rhyme: "a"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép m + a rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "mẹ", "emoji": "👩"}
        - {"word": "mơ", "emoji": "🍑"}
        - {"word": "mèo", "emoji": "🐱"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ m."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **mẹ**, **mơ**, **mèo** đều có chữ **m**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-m"
    prompt: "Tiếng nào bắt đầu bằng chữ **m**?"
    options:
      - {"id": "a", "text": "lá"}
      - {"id": "b", "text": "mẹ"}
      - {"id": "c", "text": "tay"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"mẹ\" bắt đầu bằng chữ m."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-m"
    prompt: "Hình 🍑 là tiếng nào?"
    options:
      - {"id": "a", "text": "mơ"}
      - {"id": "b", "text": "vở"}
      - {"id": "c", "text": "sách"}
    answer: {"correct": ["a"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🍑 là \"mơ\"."

  - id: "b8"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-tu-m"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "mèo"}
    options:
      - {"id": "a", "text": "cây"}
      - {"id": "b", "text": "lá"}
      - {"id": "c", "text": "mèo"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"mèo\"."

  - id: "b9"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-me"
    prompt: "Sắp xếp để tạo thành tiếng **mẹ**:"
    options:
      - {"id": "x2", "text": "ẹ"}
      - {"id": "x1", "text": "m"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, phần còn lại đứng sau."
    explanation: "m + ẹ = mẹ."

  - id: "b10"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-chu-m"
    prompt: "Điền chữ còn thiếu để được tiếng **mẹ**: _ẹ"
    answer: {"accept": ["m"]}
    hint: "Chữ cần điền là chữ bé vừa học hôm nay."
    explanation: "m + ẹ = mẹ."

  - id: "b11"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-m"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "👩", "right": "mẹ"}
      - {"left": "🍑", "right": "mơ"}
      - {"left": "🐱", "right": "mèo"}
    answer: {"pairs": [["👩", "mẹ"], ["🍑", "mơ"], ["🐱", "mèo"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."
  - {"id": "b12", "type": "summary", "markdown": "Hôm nay bé biết chữ **M m** và đọc được: mẹ, mơ, mèo. Giỏi quá!", "say": null}
