      - {"id": "a", "text": "nơ"}
      - {"id": "b", "text": "đèn"}
      - {"id": "c", "text": "sói"}
    answer: {"correct": ["c"]}
    hint: "Nhìn kỹ hình rồi đọc to các đáp án."
    explanation: "Hình 🐺 là \"sói\"."

