blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học chữ mới: chữ s. Bé nghe và đọc theo mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Chữ **S** có hai dạng: **S** in hoa, **s** in thường.
      Âm **s** đọc là "sờ".

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "s"
      rhyme: "o"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép s + o rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "sò", "emoji": "🐚"}
        - {"word": "sói", "emoji": "🐺"}
        - {"word": "sâu", "emoji": "🐛"}
      caption: "Chạm vào từng thẻ để nghe các từ có chữ s."
  - {"id": "b5", "type": "callout", "variant": "remember", "markdown": "Các tiếng **sò**, **sói**, **sâu** đều có chữ **s**.", "say": null}

  - id: "b6"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhan-biet-chu-s"
    prompt: "Tiếng nào bắt đầu bằng chữ **s**?"
    options:
      - {"id": "a", "text": "vở"}
      - {"id": "b", "text": "sò"}
      - {"id": "c", "text": "bố"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe xem có âm cần tìm không."
    explanation: "Tiếng \"sò\" bắt đầu bằng chữ s."

  - id: "b7"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nhin-hinh-doc-tu-s"
    prompt: "Hình 🐺 là tiếng nào?"
