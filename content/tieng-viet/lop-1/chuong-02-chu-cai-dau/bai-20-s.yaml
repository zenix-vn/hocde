    options:
      - {"id": "a", "text": "bé"}
      - {"id": "b", "text": "sâu"}
      - {"id": "c", "text": "bút"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"sâu\"."

