    text: "Hôm nay mình đọc bài mới! Bé đọc thật chậm, hiểu nội dung rồi trả lời câu hỏi nhé."

  - id: "b2"
    type: "text"
    markdown: |
      Nhà em nuôi một chú chó và một chú mèo.

      Chó giữ nhà rất giỏi.

      Mèo bắt chuột rất tài.

      Em chăm sóc chúng mỗi ngày.

