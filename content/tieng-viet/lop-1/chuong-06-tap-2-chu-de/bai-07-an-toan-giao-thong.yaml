    text: "Hôm nay mình đọc bài mới! Bé đọc thật chậm, hiểu nội dung rồi trả lời câu hỏi nhé."

  - id: "b2"
    type: "text"
    markdown: |
      Đèn đỏ thì dừng lại.

      Đèn xanh thì được đi.

      Khi ngồi trên xe máy, em phải đội mũ bảo hiểm.

      Em luôn đi theo người lớn khi qua đường.

