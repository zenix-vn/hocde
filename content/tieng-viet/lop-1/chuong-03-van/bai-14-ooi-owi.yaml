      - {"id": "x1", "text": "n"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "n + ồi = nồi."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-ooi"
    prompt: "Điền phần còn lại để được tiếng **nồi** 🍲: n_"
    answer: {"accept": ["ồi", "ôi"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "n + ồi = nồi."

  - id: "b12"
    type: "exercise"
