      - {"id": "b", "text": "khỉ"}
      - {"id": "c", "text": "chơi"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"chơi\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-ooi"
    prompt: "Nối hình với từ:"
