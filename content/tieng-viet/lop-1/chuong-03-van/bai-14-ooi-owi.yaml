      - {"id": "b", "text": "bơi"}
      - {"id": "c", "text": "tôm"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"bơi\" có vần ơi."

