      - {"left": "⛰️", "right": "đồi"}
      - {"left": "🛏️", "right": "gối"}
    answer: {"pairs": [["🍲", "nồi"], ["⛰️", "đồi"], ["🛏️", "gối"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ôi và ơi** và đọc được: nồi, đồi, gối, bơi, chơi, trời. Giỏi quá!"
