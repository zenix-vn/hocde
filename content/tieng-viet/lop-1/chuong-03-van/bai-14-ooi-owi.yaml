schema: 1
slug: "tv1-van-14-ooi-owi"
title: "Vần ôi – ơi"
summary: "Học vần ôi và ơi; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôi và ơi. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôi**: ghép âm đầu với vần để được tiếng.
      - **n** + **ôi** → **nồi**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "n"
      rhyme: "ôi"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép n + ôi rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ơi**: ghép âm đầu với vần để được tiếng.
      - **b** + **ơi** → **bơi**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "b"
      rhyme: "ơi"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ơi rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "nồi", "emoji": "🍲"}
        - {"word": "đồi", "emoji": "⛰️"}
        - {"word": "gối", "emoji": "🛏️"}
        - {"word": "bơi", "emoji": "🏊"}
        - {"word": "chơi", "emoji": "🎮"}
        - {"word": "trời", "emoji": "🌤️"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần ôi và ơi."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ôi** hoặc **ơi**: **nồi**, **đồi**, **gối**, **bơi**, **chơi**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-ooi"
    prompt: "Tiếng nào có vần **ôi**?"
    options:
      - {"id": "a", "text": "nồi"}
      - {"id": "b", "text": "ong"}
      - {"id": "c", "text": "khỉ"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"nồi\" có vần ôi."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-owi"
    prompt: "Tiếng nào có vần **ơi**?"
