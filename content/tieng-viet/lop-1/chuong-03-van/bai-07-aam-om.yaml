schema: 1
slug: "tv1-van-07-aam-om"
title: "Vần âm – om"
summary: "Học vần âm và om; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: âm và om. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **âm**: ghép âm đầu với vần để được tiếng.
      - **n** + **âm** → **nấm**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "n"
      rhyme: "âm"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép n + âm rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **om**: ghép âm đầu với vần để được tiếng.
      - **x** + **om** → **xóm**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "x"
      rhyme: "om"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép x + om rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "nấm", "emoji": "🍄"}
        - {"word": "ấm", "emoji": "🫖"}
        - {"word": "mâm", "emoji": "🍽️"}
        - {"word": "xóm", "emoji": "🏘️"}
        - {"word": "bom", "emoji": "💣"}
        - {"word": "nhóm", "emoji": "👥"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần âm và om."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **âm** hoặc **om**: **nấm**, **ấm**, **mâm**, **xóm**, **bom**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-aam"
    prompt: "Tiếng nào có vần **âm**?"
    options:
      - {"id": "a", "text": "mơ"}
      - {"id": "b", "text": "đàn"}
      - {"id": "c", "text": "nấm"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"nấm\" có vần âm."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-om"
    prompt: "Tiếng nào có vần **om**?"
    options:
      - {"id": "a", "text": "xô"}
      - {"id": "b", "text": "mẹ"}
      - {"id": "c", "text": "xóm"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"xóm\" có vần om."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-naam"
    prompt: "Sắp xếp để tạo thành tiếng **nấm**:"
    options:
      - {"id": "x2", "text": "ấm"}
      - {"id": "x1", "text": "n"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "n + ấm = nấm."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-aam"
    prompt: "Điền phần còn lại để được tiếng **nấm** 🍄: n_"
    answer: {"accept": ["ấm", "âm"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "n + ấm = nấm."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-om"
    prompt: "Điền phần còn lại để được tiếng **xóm** 🏘️: x_"
    answer: {"accept": ["óm", "om"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "x + óm = xóm."

  - id: "b13"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-van-om"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "bom"}
    options:
      - {"id": "a", "text": "bom"}
      - {"id": "b", "text": "cam"}
      - {"id": "c", "text": "kem"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"bom\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-aam"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🍄", "right": "nấm"}
      - {"left": "🫖", "right": "ấm"}
      - {"left": "🍽️", "right": "mâm"}
    answer: {"pairs": [["🍄", "nấm"], ["🫖", "ấm"], ["🍽️", "mâm"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **âm và om** và đọc được: nấm, ấm, mâm, xóm, bom, nhóm. Giỏi quá!"
