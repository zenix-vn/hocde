title: "Vần iêp – iêc"
summary: "Học vần iêp và iêc; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: iêp và iêc. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **iêp**: ghép âm đầu với vần để được tiếng.
      - **t** + **iêp** → **tiếp**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "t", "rhyme": "iêp", "tones": ["sắc", "nặng"], "caption": "Ghép t + iêp rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **iêc**: ghép âm đầu với vần để được tiếng.
      - **x** + **iêc** → **xiếc**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "x", "rhyme": "iêc", "tones": ["sắc", "nặng"], "caption": "Ghép x + iêc rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

