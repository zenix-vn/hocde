      caption: "Ghép ng + oan rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **oat**: ghép âm đầu với vần để được tiếng.
      - **h** + **oat** → **hoạt**

