    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: oan và oat. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **oan**: ghép âm đầu với vần để được tiếng.
      - **ng** + **oan** → **ngoan**

