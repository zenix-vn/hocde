      - {"left": "🐻", "right": "mập"}
    answer: {"pairs": [["📓", "tập"], ["🏞️", "đập"], ["🐻", "mập"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **âp và op** và đọc được: tập, đập, mập, họp, cọp, bóp. Giỏi quá!"
