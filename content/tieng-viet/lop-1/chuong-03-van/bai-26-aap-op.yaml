      - {"id": "b", "text": "sách"}
      - {"id": "c", "text": "bò"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"cọp\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-aap"
    prompt: "Nối hình với từ:"
    pairs:
