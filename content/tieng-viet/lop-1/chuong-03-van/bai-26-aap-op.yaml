      - {"id": "a", "text": "vở"}
      - {"id": "b", "text": "họp"}
      - {"id": "c", "text": "ghế"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"họp\" có vần op."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-taap"
    prompt: "Sắp xếp để tạo thành tiếng **tập**:"
    options:
      - {"id": "x1", "text": "t"}
      - {"id": "x2", "text": "ập"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "t + ập = tập."

