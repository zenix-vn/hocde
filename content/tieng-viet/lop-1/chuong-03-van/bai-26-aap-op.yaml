    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-aap"
    prompt: "Điền phần còn lại để được tiếng **tập** 📓: t_"
    answer: {"accept": ["ập", "âp"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "t + ập = tập."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-op"
