slug: "tv1-van-26-aap-op"
title: "Vần âp – op"
summary: "Học vần âp và op; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: âp và op. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **âp**: ghép âm đầu với vần để được tiếng.
      - **t** + **âp** → **tập**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "t", "rhyme": "âp", "tones": ["sắc", "nặng"], "caption": "Ghép t + âp rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **op**: ghép âm đầu với vần để được tiếng.
      - **h** + **op** → **họp**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "h", "rhyme": "op", "tones": ["sắc", "nặng"], "caption": "Ghép h + op rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "tập", "emoji": "📓"}
        - {"word": "đập", "emoji": "🏞️"}
        - {"word": "mập", "emoji": "🐻"}
        - {"word": "họp", "emoji": "🧑‍🤝‍🧑"}
        - {"word": "cọp", "emoji": "🐯"}
        - {"word": "bóp", "emoji": "🤏"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần âp và op."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **âp** hoặc **op**: **tập**, **đập**, **mập**, **họp**, **cọp**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-aap"
    prompt: "Tiếng nào có vần **âp**?"
    options:
      - {"id": "a", "text": "nhà"}
      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "tập"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"tập\" có vần âp."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-op"
    prompt: "Tiếng nào có vần **op**?"
