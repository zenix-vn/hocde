    options:
      - {"id": "a", "text": "mơ"}
      - {"id": "b", "text": "bắp"}
      - {"id": "c", "text": "vịt"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"bắp\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-ap"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🗼", "right": "tháp"}
      - {"left": "🔌", "right": "cáp"}
      - {"left": "🙋", "right": "đáp"}
    answer: {"pairs": [["🗼", "tháp"], ["🔌", "cáp"], ["🙋", "đáp"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ap và ăp** và đọc được: tháp, cáp, đáp, cặp, bắp, gặp. Giỏi quá!"
