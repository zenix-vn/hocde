schema: 1
slug: "tv1-van-25-ap-awp"
title: "Vần ap – ăp"
summary: "Học vần ap và ăp; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ap và ăp. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ap**: ghép âm đầu với vần để được tiếng.
      - **th** + **ap** → **tháp**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "th", "rhyme": "ap", "tones": ["sắc", "nặng"], "caption": "Ghép th + ap rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ăp**: ghép âm đầu với vần để được tiếng.
      - **c** + **ăp** → **cặp**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "c", "rhyme": "ăp", "tones": ["sắc", "nặng"], "caption": "Ghép c + ăp rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "tháp", "emoji": "🗼"}
        - {"word": "cáp", "emoji": "🔌"}
        - {"word": "đáp", "emoji": "🙋"}
        - {"word": "cặp", "emoji": "🎒"}
        - {"word": "bắp", "emoji": "🌽"}
        - {"word": "gặp", "emoji": "🤝"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần ap và ăp."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ap** hoặc **ăp**: **tháp**, **cáp**, **đáp**, **cặp**, **bắp**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-ap"
    prompt: "Tiếng nào có vần **ap**?"
    options:
      - {"id": "a", "text": "na"}
      - {"id": "b", "text": "tháp"}
      - {"id": "c", "text": "xô"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"tháp\" có vần ap."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-awp"
    prompt: "Tiếng nào có vần **ăp**?"
    options:
      - {"id": "a", "text": "cam"}
      - {"id": "b", "text": "dê"}
      - {"id": "c", "text": "cặp"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"cặp\" có vần ăp."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-thap"
    prompt: "Sắp xếp để tạo thành tiếng **tháp**:"
    options:
      - {"id": "x2", "text": "áp"}
      - {"id": "x1", "text": "th"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "th + áp = tháp."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-ap"
    prompt: "Điền phần còn lại để được tiếng **tháp** 🗼: th_"
    answer: {"accept": ["áp", "ap"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "th + áp = tháp."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-awp"
    prompt: "Điền phần còn lại để được tiếng **cặp** 🎒: c_"
    answer: {"accept": ["ặp", "ăp"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "c + ặp = cặp."

