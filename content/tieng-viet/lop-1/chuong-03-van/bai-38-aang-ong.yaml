      - {"left": "🙆", "right": "vâng"}
      - {"left": "🏋️", "right": "nâng"}
    answer: {"pairs": [["🏢", "tầng"], ["🙆", "vâng"], ["🏋️", "nâng"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **âng và ong** và đọc được: tầng, vâng, nâng, bóng, ong, xong. Giỏi quá!"
