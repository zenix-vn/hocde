      - {"id": "b", "text": "ghế"}
      - {"id": "c", "text": "đàn"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"ong\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-aang"
    prompt: "Nối hình với từ:"
