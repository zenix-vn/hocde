    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "t + ầng = tầng."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-aang"
    prompt: "Điền phần còn lại để được tiếng **tầng** 🏢: t_"
    answer: {"accept": ["ầng", "âng"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "t + ầng = tầng."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-ong"
