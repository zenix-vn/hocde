schema: 1
slug: "tv1-van-38-aang-ong"
title: "Vần âng – ong"
summary: "Học vần âng và ong; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: âng và ong. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **âng**: ghép âm đầu với vần để được tiếng.
      - **t** + **âng** → **tầng**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "t"
      rhyme: "âng"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép t + âng rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ong**: ghép âm đầu với vần để được tiếng.
      - **b** + **ong** → **bóng**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "b"
      rhyme: "ong"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ong rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "tầng", "emoji": "🏢"}
        - {"word": "vâng", "emoji": "🙆"}
        - {"word": "nâng", "emoji": "🏋️"}
        - {"word": "bóng", "emoji": "⚽"}
        - {"word": "ong", "emoji": "🐝"}
        - {"word": "xong", "emoji": "✅"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần âng và ong."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **âng** hoặc **ong**: **tầng**, **vâng**, **nâng**, **bóng**, **ong**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-aang"
    prompt: "Tiếng nào có vần **âng**?"
    options:
      - {"id": "a", "text": "tầng"}
      - {"id": "b", "text": "lá"}
      - {"id": "c", "text": "phở"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"tầng\" có vần âng."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-ong"
    prompt: "Tiếng nào có vần **ong**?"
    options:
      - {"id": "a", "text": "nơ"}
      - {"id": "b", "text": "sách"}
      - {"id": "c", "text": "bóng"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"bóng\" có vần ong."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-taang"
    prompt: "Sắp xếp để tạo thành tiếng **tầng**:"
    options:
