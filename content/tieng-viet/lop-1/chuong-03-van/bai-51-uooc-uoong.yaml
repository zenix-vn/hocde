schema: 1
slug: "tv1-van-51-uooc-uoong"
title: "Vần uôc – uông"
summary: "Học vần uôc và uông; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: uôc và uông. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **uôc**: ghép âm đầu với vần để được tiếng.
      - **th** + **uôc** → **thuốc**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "th", "rhyme": "uôc", "tones": ["sắc", "nặng"], "caption": "Ghép th + uôc rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **uông**: ghép âm đầu với vần để được tiếng.
      - **ch** + **uông** → **chuông**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "ch"
      rhyme: "uông"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép ch + uông rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "thuốc", "emoji": "💊"}
        - {"word": "cuốc", "emoji": "⛏️"}
        - {"word": "luộc", "emoji": "🥚"}
        - {"word": "chuông", "emoji": "🔔"}
        - {"word": "vuông", "emoji": "⬜"}
        - {"word": "uống", "emoji": "🥤"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần uôc và uông."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **uôc** hoặc **uông**: **thuốc**, **cuốc**, **luộc**, **chuông**, **vuông**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uooc"
    prompt: "Tiếng nào có vần **uôc**?"
    options:
      - {"id": "a", "text": "bàn"}
      - {"id": "b", "text": "nhà"}
      - {"id": "c", "text": "thuốc"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"thuốc\" có vần uôc."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uoong"
    prompt: "Tiếng nào có vần **uông**?"
    options:
      - {"id": "a", "text": "cuốc"}
      - {"id": "b", "text": "chuông"}
      - {"id": "c", "text": "trâu"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"chuông\" có vần uông."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-thuooc"
    prompt: "Sắp xếp để tạo thành tiếng **thuốc**:"
    options:
      - {"id": "x1", "text": "th"}
      - {"id": "x2", "text": "uốc"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "th + uốc = thuốc."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-uooc"
    prompt: "Điền phần còn lại để được tiếng **thuốc** 💊: th_"
    answer: {"accept": ["uốc", "uôc"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "th + uốc = thuốc."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-uoong"
    prompt: "Điền phần còn lại để được tiếng **chuông** 🔔: ch_"
    answer: {"accept": ["uông"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "ch + uông = chuông."

  - id: "b13"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-van-uoong"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "vuông"}
    options:
      - {"id": "a", "text": "vuông"}
      - {"id": "b", "text": "bé"}
      - {"id": "c", "text": "rùa"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"vuông\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-uooc"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "💊", "right": "thuốc"}
      - {"left": "⛏️", "right": "cuốc"}
      - {"left": "🥚", "right": "luộc"}
    answer: {"pairs": [["💊", "thuốc"], ["⛏️", "cuốc"], ["🥚", "luộc"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **uôc và uông** và đọc được: thuốc, cuốc, luộc, chuông, vuông, uống. Giỏi quá!"
