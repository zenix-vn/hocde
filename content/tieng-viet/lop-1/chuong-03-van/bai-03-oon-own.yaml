schema: 1
slug: "tv1-van-03-oon-own"
title: "Vần ôn – ơn"
summary: "Học vần ôn và ơn; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôn và ơn. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôn**: ghép âm đầu với vần để được tiếng.
      - **b** + **ôn** → **bồn**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "b"
      rhyme: "ôn"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + ôn rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ơn**: ghép âm đầu với vần để được tiếng.
      - **s** + **ơn** → **sơn**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "s"
      rhyme: "ơn"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép s + ơn rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "bồn", "emoji": "🛁"}
        - {"word": "hôn", "emoji": "😘"}
        - {"word": "ồn", "emoji": "🔊"}
        - {"word": "sơn", "emoji": "🎨"}
        - {"word": "cơn", "emoji": "🌧️"}
        - {"word": "đơn", "emoji": "📝"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần ôn và ơn."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ôn** hoặc **ơn**: **bồn**, **hôn**, **ồn**, **sơn**, **cơn**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-oon"
    prompt: "Tiếng nào có vần **ôn**?"
    options:
      - {"id": "a", "text": "sò"}
      - {"id": "b", "text": "bồn"}
      - {"id": "c", "text": "bàn"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"bồn\" có vần ôn."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-own"
