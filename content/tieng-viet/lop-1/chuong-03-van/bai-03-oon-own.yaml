    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-oon"
    prompt: "Điền phần còn lại để được tiếng **bồn** 🛁: b_"
    answer: {"accept": ["ồn", "ôn"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "b + ồn = bồn."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
