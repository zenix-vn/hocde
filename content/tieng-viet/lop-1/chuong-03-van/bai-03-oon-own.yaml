    answer: {"pairs": [["🛁", "bồn"], ["😘", "hôn"], ["🔊", "ồn"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ôn và ơn** và đọc được: bồn, hôn, ồn, sơn, cơn, đơn. Giỏi quá!"
