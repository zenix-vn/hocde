      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "bò"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"cơn\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-oon"
    prompt: "Nối hình với từ:"
