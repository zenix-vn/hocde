status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôc và uc. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôc**: ghép âm đầu với vần để được tiếng.
      - **c** + **ôc** → **cốc**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
