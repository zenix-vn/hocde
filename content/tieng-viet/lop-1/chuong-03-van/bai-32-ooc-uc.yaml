  - id: "b4"
    type: "text"
    markdown: |
      Vần **uc**: ghép âm đầu với vần để được tiếng.
      - **c** + **uc** → **cúc**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "c", "rhyme": "uc", "tones": ["sắc", "nặng"], "caption": "Ghép c + uc rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

