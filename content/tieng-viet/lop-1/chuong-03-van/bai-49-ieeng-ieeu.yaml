      caption: "Chạm vào từng thẻ để nghe các từ có vần iêng và iêu."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **iêng** hoặc **iêu**: **miệng**, **tiếng**, **chiêng**, **diều**, **chiều**."

