title: "Vần iêng – iêu"
summary: "Học vần iêng và iêu; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: iêng và iêu. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **iêng**: ghép âm đầu với vần để được tiếng.
      - **m** + **iêng** → **miệng**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "m"
      rhyme: "iêng"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép m + iêng rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **iêu**: ghép âm đầu với vần để được tiếng.
      - **d** + **iêu** → **diều**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "d"
      rhyme: "iêu"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép d + iêu rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

