blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôm và ơm. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôm**: ghép âm đầu với vần để được tiếng.
      - **t** + **ôm** → **tôm**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "t"
      rhyme: "ôm"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép t + ôm rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ơm**: ghép âm đầu với vần để được tiếng.
      - **c** + **ơm** → **cơm**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
