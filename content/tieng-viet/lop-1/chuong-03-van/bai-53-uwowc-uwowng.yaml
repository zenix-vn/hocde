    text: "Hôm nay mình học vần mới: ươc và ương. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ươc**: ghép âm đầu với vần để được tiếng.
      - **th** + **ươc** → **thước**

