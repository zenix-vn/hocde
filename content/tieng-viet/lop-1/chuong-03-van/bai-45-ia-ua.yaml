title: "Vần ia – ua"
summary: "Học vần ia và ua; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ia và ua. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ia**: ghép âm đầu với vần để được tiếng.
      - **t** + **ia** → **tia**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "t"
      rhyme: "ia"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép t + ia rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ua**: ghép âm đầu với vần để được tiếng.
      - **c** + **ua** → **cua**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "c"
      rhyme: "ua"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép c + ua rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

