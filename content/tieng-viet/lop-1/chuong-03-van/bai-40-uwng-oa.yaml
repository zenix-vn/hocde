        - {"word": "hoa", "emoji": "🌸"}
        - {"word": "loa", "emoji": "📢"}
        - {"word": "toa", "emoji": "🚃"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần ưng và oa."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ưng** hoặc **oa**: **trứng**, **dừng**, **mừng**, **hoa**, **loa**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uwng"
    prompt: "Tiếng nào có vần **ưng**?"
