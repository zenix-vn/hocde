slug: "tv1-van-40-uwng-oa"
title: "Vần ưng – oa"
summary: "Học vần ưng và oa; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ưng và oa. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ưng**: ghép âm đầu với vần để được tiếng.
      - **tr** + **ưng** → **trứng**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "tr"
      rhyme: "ưng"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép tr + ưng rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **oa**: ghép âm đầu với vần để được tiếng.
      - **h** + **oa** → **hoa**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "h"
      rhyme: "oa"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép h + oa rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
