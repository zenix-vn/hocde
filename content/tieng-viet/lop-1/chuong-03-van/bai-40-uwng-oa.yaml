    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ưng và oa** và đọc được: trứng, dừng, mừng, hoa, loa, toa. Giỏi quá!"
