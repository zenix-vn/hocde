    mood: "happy"
    text: "Hôm nay mình học vần mới: ươn và ươt. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ươn**: ghép âm đầu với vần để được tiếng.
      - **v** + **ươn** → **vườn**

