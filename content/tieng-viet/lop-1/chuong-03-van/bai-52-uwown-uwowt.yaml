      caption: "Ghép v + ươn rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ươt**: ghép âm đầu với vần để được tiếng.
      - **l** + **ươt** → **lướt**

