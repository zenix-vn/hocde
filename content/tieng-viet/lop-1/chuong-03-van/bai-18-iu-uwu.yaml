schema: 1
slug: "tv1-van-18-iu-uwu"
title: "Vần iu – ưu"
summary: "Học vần iu và ưu; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: iu và ưu. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **iu**: ghép âm đầu với vần để được tiếng.
      - **r** + **iu** → **rìu**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "r"
      rhyme: "iu"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép r + iu rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ưu**: ghép âm đầu với vần để được tiếng.
      - **l** + **ưu** → **lựu**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "l"
      rhyme: "ưu"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép l + ưu rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
