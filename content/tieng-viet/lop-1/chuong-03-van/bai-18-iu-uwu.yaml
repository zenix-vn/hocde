        - {"word": "bưu", "emoji": "📮"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần iu và ưu."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **iu** hoặc **ưu**: **rìu**, **xíu**, **chịu**, **lựu**, **cứu**."

  - id: "b8"
    type: "exercise"
