      - {"left": "🍈", "right": "mít"}
      - {"left": "🥩", "right": "thịt"}
    answer: {"pairs": [["🦆", "vịt"], ["🍈", "mít"], ["🥩", "thịt"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **it và ut** và đọc được: vịt, mít, thịt, bút, phút, mút. Giỏi quá!"
