      - {"id": "b", "text": "na"}
      - {"id": "c", "text": "phút"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"phút\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-it"
    prompt: "Nối hình với từ:"
    pairs:
