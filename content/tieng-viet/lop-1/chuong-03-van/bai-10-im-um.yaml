  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **im** hoặc **um**: **chim**, **kim**, **phim**, **chùm**, **cúm**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-im"
    prompt: "Tiếng nào có vần **im**?"
