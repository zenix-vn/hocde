schema: 1
slug: "tv1-van-10-im-um"
title: "Vần im – um"
summary: "Học vần im và um; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: im và um. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **im**: ghép âm đầu với vần để được tiếng.
      - **ch** + **im** → **chim**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "ch"
      rhyme: "im"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép ch + im rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **um**: ghép âm đầu với vần để được tiếng.
      - **ch** + **um** → **chùm**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "ch"
      rhyme: "um"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép ch + um rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

