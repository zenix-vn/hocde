    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **im và um** và đọc được: chim, kim, phim, chùm, cúm, bụm. Giỏi quá!"
