      - {"left": "🎨", "right": "màu"}
      - {"left": "🤕", "right": "đau"}
    answer: {"pairs": [["🥬", "rau"], ["🎨", "màu"], ["🤕", "đau"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **au và âu** và đọc được: rau, màu, đau, trâu, dâu, sâu. Giỏi quá!"
