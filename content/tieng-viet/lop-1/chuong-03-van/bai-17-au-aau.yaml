      - {"id": "b", "text": "dâu"}
      - {"id": "c", "text": "lúa"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"dâu\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-au"
    prompt: "Nối hình với từ:"
