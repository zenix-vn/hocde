    prompt: "Điền phần còn lại để được tiếng **rau** 🥬: r_"
    answer: {"accept": ["au"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "r + au = rau."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
