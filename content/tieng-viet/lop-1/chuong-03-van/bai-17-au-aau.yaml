schema: 1
slug: "tv1-van-17-au-aau"
title: "Vần au – âu"
summary: "Học vần au và âu; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: au và âu. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **au**: ghép âm đầu với vần để được tiếng.
      - **r** + **au** → **rau**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "r"
      rhyme: "au"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép r + au rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **âu**: ghép âm đầu với vần để được tiếng.
      - **tr** + **âu** → **trâu**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "tr"
      rhyme: "âu"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép tr + âu rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "rau", "emoji": "🥬"}
        - {"word": "màu", "emoji": "🎨"}
        - {"word": "đau", "emoji": "🤕"}
        - {"word": "trâu", "emoji": "🐃"}
        - {"word": "dâu", "emoji": "🍓"}
        - {"word": "sâu", "emoji": "🐛"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần au và âu."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **au** hoặc **âu**: **rau**, **màu**, **đau**, **trâu**, **dâu**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-au"
    prompt: "Tiếng nào có vần **au**?"
    options:
      - {"id": "a", "text": "cá"}
      - {"id": "b", "text": "mèo"}
      - {"id": "c", "text": "rau"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"rau\" có vần au."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-aau"
