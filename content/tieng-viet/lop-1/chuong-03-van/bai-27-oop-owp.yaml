title: "Vần ôp – ơp"
summary: "Học vần ôp và ơp; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôp và ơp. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôp**: ghép âm đầu với vần để được tiếng.
      - **h** + **ôp** → **hộp**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "h", "rhyme": "ôp", "tones": ["sắc", "nặng"], "caption": "Ghép h + ôp rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ơp**: ghép âm đầu với vần để được tiếng.
      - **l** + **ơp** → **lớp**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "l", "rhyme": "ơp", "tones": ["sắc", "nặng"], "caption": "Ghép l + ơp rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

