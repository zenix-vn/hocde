    answer: {"pairs": [["🍦", "kem"], ["👀", "xem"], ["👶", "em"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **em và êm** và đọc được: kem, xem, em, đêm, mềm, êm. Giỏi quá!"
