schema: 1
slug: "tv1-van-09-em-eem"
title: "Vần em – êm"
summary: "Học vần em và êm; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: em và êm. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **em**: ghép âm đầu với vần để được tiếng.
      - **k** + **em** → **kem**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "k"
      rhyme: "em"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép k + em rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **êm**: ghép âm đầu với vần để được tiếng.
      - **đ** + **êm** → **đêm**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "đ"
      rhyme: "êm"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép đ + êm rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "kem", "emoji": "🍦"}
        - {"word": "xem", "emoji": "👀"}
        - {"word": "em", "emoji": "👶"}
        - {"word": "đêm", "emoji": "🌙"}
        - {"word": "mềm", "emoji": "☁️"}
        - {"word": "êm", "emoji": "🛋️"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần em và êm."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **em** hoặc **êm**: **kem**, **xem**, **em**, **đêm**, **mềm**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-em"
    prompt: "Tiếng nào có vần **em**?"
    options:
      - {"id": "a", "text": "bé"}
      - {"id": "b", "text": "kem"}
      - {"id": "c", "text": "nơ"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"kem\" có vần em."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-eem"
