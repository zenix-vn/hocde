schema: 1
slug: "tv1-van-43-uaan-uyeen"
title: "Vần uân – uyên"
summary: "Học vần uân và uyên; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: uân và uyên. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **uân**: ghép âm đầu với vần để được tiếng.
      - **x** + **uân** → **xuân**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "x"
      rhyme: "uân"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép x + uân rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **uyên**: ghép âm đầu với vần để được tiếng.
      - **th** + **uyên** → **thuyền**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "th"
      rhyme: "uyên"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép th + uyên rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "xuân", "emoji": "🌷"}
        - {"word": "tuần", "emoji": "📆"}
        - {"word": "quần", "emoji": "👖"}
        - {"word": "thuyền", "emoji": "⛵"}
        - {"word": "quyển", "emoji": "📖"}
        - {"word": "chuyền", "emoji": "🏐"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần uân và uyên."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **uân** hoặc **uyên**: **xuân**, **tuần**, **quần**, **thuyền**, **quyển**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uaan"
    prompt: "Tiếng nào có vần **uân**?"
    options:
      - {"id": "a", "text": "xuân"}
      - {"id": "b", "text": "voi"}
      - {"id": "c", "text": "mèo"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"xuân\" có vần uân."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uyeen"
    prompt: "Tiếng nào có vần **uyên**?"
    options:
      - {"id": "a", "text": "thuyền"}
      - {"id": "b", "text": "rổ"}
      - {"id": "c", "text": "pin"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"thuyền\" có vần uyên."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-xuaan"
    prompt: "Sắp xếp để tạo thành tiếng **xuân**:"
    options:
      - {"id": "x2", "text": "uân"}
      - {"id": "x1", "text": "x"}
    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "x + uân = xuân."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-uaan"
    prompt: "Điền phần còn lại để được tiếng **xuân** 🌷: x_"
    answer: {"accept": ["uân"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "x + uân = xuân."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-uyeen"
    prompt: "Điền phần còn lại để được tiếng **thuyền** ⛵: th_"
    answer: {"accept": ["uyền", "uyên"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "th + uyền = thuyền."

  - id: "b13"
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-chon-van-uyeen"
    prompt: "Nghe và chọn tiếng bé nghe được:"
    listen: {"text": "quyển"}
    options:
      - {"id": "a", "text": "phở"}
      - {"id": "b", "text": "kem"}
      - {"id": "c", "text": "quyển"}
    answer: {"correct": ["c"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"quyển\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-uaan"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🌷", "right": "xuân"}
      - {"left": "📆", "right": "tuần"}
      - {"left": "👖", "right": "quần"}
    answer: {"pairs": [["🌷", "xuân"], ["📆", "tuần"], ["👖", "quần"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **uân và uyên** và đọc được: xuân, tuần, quần, thuyền, quyển, chuyền. Giỏi quá!"
