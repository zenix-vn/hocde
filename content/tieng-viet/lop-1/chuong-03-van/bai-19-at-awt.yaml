      - {"id": "a", "text": "chim"}
      - {"id": "b", "text": "lá"}
      - {"id": "c", "text": "mắt"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"mắt\" có vần ăt."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-hat"
    prompt: "Sắp xếp để tạo thành tiếng **hát**:"
    options:
