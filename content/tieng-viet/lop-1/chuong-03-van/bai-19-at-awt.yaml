      - {"id": "b", "text": "cắt"}
      - {"id": "c", "text": "bò"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"cắt\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-at"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🎤", "right": "hát"}
      - {"left": "🏖️", "right": "cát"}
      - {"left": "🥣", "right": "bát"}
    answer: {"pairs": [["🎤", "hát"], ["🏖️", "cát"], ["🥣", "bát"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **at và ăt** và đọc được: hát, cát, bát, mắt, cắt, tắt. Giỏi quá!"
