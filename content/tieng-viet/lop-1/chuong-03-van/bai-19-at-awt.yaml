    prompt: "Điền phần còn lại để được tiếng **hát** 🎤: h_"
    answer: {"accept": ["át", "at"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "h + át = hát."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-awt"
    prompt: "Điền phần còn lại để được tiếng **mắt** 👁️: m_"
