schema: 1
slug: "tv1-van-19-at-awt"
title: "Vần at – ăt"
summary: "Học vần at và ăt; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: at và ăt. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **at**: ghép âm đầu với vần để được tiếng.
      - **h** + **at** → **hát**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "h", "rhyme": "at", "tones": ["sắc", "nặng"], "caption": "Ghép h + at rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ăt**: ghép âm đầu với vần để được tiếng.
      - **m** + **ăt** → **mắt**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "m", "rhyme": "ăt", "tones": ["sắc", "nặng"], "caption": "Ghép m + ăt rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "hát", "emoji": "🎤"}
        - {"word": "cát", "emoji": "🏖️"}
        - {"word": "bát", "emoji": "🥣"}
        - {"word": "mắt", "emoji": "👁️"}
        - {"word": "cắt", "emoji": "✂️"}
        - {"word": "tắt", "emoji": "📴"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần at và ăt."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **at** hoặc **ăt**: **hát**, **cát**, **bát**, **mắt**, **cắt**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-at"
    prompt: "Tiếng nào có vần **at**?"
    options:
      - {"id": "a", "text": "hát"}
      - {"id": "b", "text": "dê"}
      - {"id": "c", "text": "ghế"}
    answer: {"correct": ["a"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"hát\" có vần at."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-awt"
    prompt: "Tiếng nào có vần **ăt**?"
