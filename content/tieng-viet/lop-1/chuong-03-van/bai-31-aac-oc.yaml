    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **âc** hoặc **oc**: **gấc**, **bậc**, **nhấc**, **sóc**, **tóc**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-aac"
