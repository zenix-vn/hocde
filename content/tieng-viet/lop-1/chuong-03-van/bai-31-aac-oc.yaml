status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: âc và oc. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **âc**: ghép âm đầu với vần để được tiếng.
      - **g** + **âc** → **gấc**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "g", "rhyme": "âc", "tones": ["sắc", "nặng"], "caption": "Ghép g + âc rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **oc**: ghép âm đầu với vần để được tiếng.
      - **s** + **oc** → **sóc**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "s", "rhyme": "oc", "tones": ["sắc", "nặng"], "caption": "Ghép s + oc rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
