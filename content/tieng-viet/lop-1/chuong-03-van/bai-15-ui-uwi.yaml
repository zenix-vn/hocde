blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ui và ưi. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ui**: ghép âm đầu với vần để được tiếng.
      - **t** + **ui** → **túi**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "t"
      rhyme: "ui"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép t + ui rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ưi**: ghép âm đầu với vần để được tiếng.
      - **g** + **ưi** → **gửi**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
