      caption: "Chạm vào từng thẻ để nghe các từ có vần ân và on."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ân** hoặc **on**: **cân**, **chân**, **sân**, **nón**, **son**."

  - id: "b8"
