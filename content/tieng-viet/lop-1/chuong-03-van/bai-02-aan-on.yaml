schema: 1
slug: "tv1-van-02-aan-on"
title: "Vần ân – on"
summary: "Học vần ân và on; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ân và on. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ân**: ghép âm đầu với vần để được tiếng.
      - **c** + **ân** → **cân**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "c"
      rhyme: "ân"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép c + ân rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **on**: ghép âm đầu với vần để được tiếng.
      - **n** + **on** → **nón**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "n"
      rhyme: "on"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép n + on rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
