      - {"left": "🍪", "right": "khuôn"}
    answer: {"pairs": [["😢", "buồn"], ["📖", "cuốn"], ["🍪", "khuôn"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **uôn và uôt** và đọc được: buồn, cuốn, khuôn, chuột, nuốt, tuột. Giỏi quá!"
