    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "b + uồn = buồn."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-uoon"
    prompt: "Điền phần còn lại để được tiếng **buồn** 😢: b_"
    answer: {"accept": ["uồn", "uôn"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "b + uồn = buồn."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
