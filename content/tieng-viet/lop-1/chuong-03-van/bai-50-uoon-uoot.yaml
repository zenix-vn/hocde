      - {"id": "b", "text": "bố"}
      - {"id": "c", "text": "cua"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"nuốt\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-uoon"
    prompt: "Nối hình với từ:"
