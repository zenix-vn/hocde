schema: 1
slug: "tv1-van-50-uoon-uoot"
title: "Vần uôn – uôt"
summary: "Học vần uôn và uôt; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: uôn và uôt. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **uôn**: ghép âm đầu với vần để được tiếng.
      - **b** + **uôn** → **buồn**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "b"
      rhyme: "uôn"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + uôn rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **uôt**: ghép âm đầu với vần để được tiếng.
      - **ch** + **uôt** → **chuột**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "ch", "rhyme": "uôt", "tones": ["sắc", "nặng"], "caption": "Ghép ch + uôt rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "buồn", "emoji": "😢"}
        - {"word": "cuốn", "emoji": "📖"}
        - {"word": "khuôn", "emoji": "🍪"}
        - {"word": "chuột", "emoji": "🐭"}
        - {"word": "nuốt", "emoji": "😋"}
        - {"word": "tuột", "emoji": "🛝"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần uôn và uôt."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **uôn** hoặc **uôt**: **buồn**, **cuốn**, **khuôn**, **chuột**, **nuốt**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uoon"
    prompt: "Tiếng nào có vần **uôn**?"
    options:
      - {"id": "a", "text": "xô"}
      - {"id": "b", "text": "buồn"}
      - {"id": "c", "text": "bé"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"buồn\" có vần uôn."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-uoot"
