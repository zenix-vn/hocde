schema: 1
slug: "tv1-van-23-et-eet"
title: "Vần et – êt"
summary: "Học vần et và êt; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: et và êt. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **et**: ghép âm đầu với vần để được tiếng.
      - **v** + **et** → **vẹt**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "v", "rhyme": "et", "tones": ["sắc", "nặng"], "caption": "Ghép v + et rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **êt**: ghép âm đầu với vần để được tiếng.
      - **t** + **êt** → **tết**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "t", "rhyme": "êt", "tones": ["sắc", "nặng"], "caption": "Ghép t + êt rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
