      caption: "Ghép c + ươi rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ươu**: ghép âm đầu với vần để được tiếng.
      - **h** + **ươu** → **hươu**

