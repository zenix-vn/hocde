    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ươi và ươu. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ươi**: ghép âm đầu với vần để được tiếng.
      - **c** + **ươi** → **cười**

