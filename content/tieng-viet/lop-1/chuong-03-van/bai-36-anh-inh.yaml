      - {"left": "🍋", "right": "chanh"}
    answer: {"pairs": [["🥮", "bánh"], ["🟢", "xanh"], ["🍋", "chanh"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **anh và inh** và đọc được: bánh, xanh, chanh, xinh, kính, đình. Giỏi quá!"
