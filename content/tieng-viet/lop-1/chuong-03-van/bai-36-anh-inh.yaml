      - {"id": "b", "text": "vịt"}
      - {"id": "c", "text": "gà"}
    answer: {"correct": ["a"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"kính\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-anh"
    prompt: "Nối hình với từ:"
