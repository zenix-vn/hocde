    answer: {"sequence": ["x1", "x2"]}
    hint: "Âm đầu đứng trước, vần đứng sau."
    explanation: "b + ánh = bánh."

  - id: "b11"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-anh"
    prompt: "Điền phần còn lại để được tiếng **bánh** 🥮: b_"
    answer: {"accept": ["ánh", "anh"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "b + ánh = bánh."

  - id: "b12"
    type: "exercise"
