      - {"id": "b", "text": "cam"}
      - {"id": "c", "text": "xinh"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"xinh\" có vần inh."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-banh"
    prompt: "Sắp xếp để tạo thành tiếng **bánh**:"
