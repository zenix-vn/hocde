schema: 1
slug: "tv1-van-36-anh-inh"
title: "Vần anh – inh"
summary: "Học vần anh và inh; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: anh và inh. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **anh**: ghép âm đầu với vần để được tiếng.
      - **b** + **anh** → **bánh**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "b"
      rhyme: "anh"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép b + anh rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **inh**: ghép âm đầu với vần để được tiếng.
      - **x** + **inh** → **xinh**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "x"
      rhyme: "inh"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép x + inh rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "bánh", "emoji": "🥮"}
        - {"word": "xanh", "emoji": "🟢"}
        - {"word": "chanh", "emoji": "🍋"}
        - {"word": "xinh", "emoji": "🌸"}
        - {"word": "kính", "emoji": "👓"}
        - {"word": "đình", "emoji": "🛖"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần anh và inh."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **anh** hoặc **inh**: **bánh**, **xanh**, **chanh**, **xinh**, **kính**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-anh"
    prompt: "Tiếng nào có vần **anh**?"
    options:
      - {"id": "a", "text": "mưa"}
      - {"id": "b", "text": "bánh"}
      - {"id": "c", "text": "bóng"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"bánh\" có vần anh."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-inh"
    prompt: "Tiếng nào có vần **inh**?"
