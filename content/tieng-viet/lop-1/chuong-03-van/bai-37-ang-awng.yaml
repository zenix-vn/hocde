slug: "tv1-van-37-ang-awng"
title: "Vần ang – ăng"
summary: "Học vần ang và ăng; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ang và ăng. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ang**: ghép âm đầu với vần để được tiếng.
      - **v** + **ang** → **vàng**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "v"
      rhyme: "ang"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép v + ang rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ăng**: ghép âm đầu với vần để được tiếng.
      - **r** + **ăng** → **răng**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "r"
      rhyme: "ăng"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép r + ăng rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

