        - {"word": "thích", "emoji": "❤️"}
        - {"word": "lịch", "emoji": "📅"}
        - {"word": "kịch", "emoji": "🎭"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần êch và ich."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **êch** hoặc **ich**: **chếch**, **ếch**, **lệch**, **thích**, **lịch**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-eech"
    prompt: "Tiếng nào có vần **êch**?"
