schema: 1
slug: "tv1-van-35-eech-ich"
title: "Vần êch – ich"
summary: "Học vần êch và ich; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: êch và ich. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **êch**: ghép âm đầu với vần để được tiếng.
      - **ch** + **êch** → **chếch**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "ch", "rhyme": "êch", "tones": ["sắc", "nặng"], "caption": "Ghép ch + êch rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ich**: ghép âm đầu với vần để được tiếng.
      - **th** + **ich** → **thích**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "th", "rhyme": "ich", "tones": ["sắc", "nặng"], "caption": "Ghép th + ich rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "chếch", "emoji": "📐"}
        - {"word": "ếch", "emoji": "🐸"}
