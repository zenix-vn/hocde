      - {"id": "b", "text": "ớt"}
      - {"id": "c", "text": "mơ"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"ớt\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-oot"
    prompt: "Nối hình với từ:"
