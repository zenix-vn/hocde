      - {"id": "a", "text": "mơ"}
      - {"id": "b", "text": "cột"}
      - {"id": "c", "text": "ong"}
    answer: {"correct": ["b"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"cột\" có vần ôt."

  - id: "b9"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-owt"
    prompt: "Tiếng nào có vần **ơt**?"
