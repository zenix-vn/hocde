    answer: {"accept": ["ột", "ôt"]}
    hint: "Phần cần điền là vần bé vừa học."
    explanation: "c + ột = cột."

  - id: "b12"
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-van-owt"
