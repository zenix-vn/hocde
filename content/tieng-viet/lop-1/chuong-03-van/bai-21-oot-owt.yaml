      - {"left": "👍", "right": "tốt"}
    answer: {"pairs": [["🏛️", "cột"], ["🤒", "sốt"], ["👍", "tốt"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ôt và ơt** và đọc được: cột, sốt, tốt, vớt, ớt, rớt. Giỏi quá!"
