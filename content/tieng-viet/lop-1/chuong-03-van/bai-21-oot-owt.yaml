      - {"id": "b", "text": "bố"}
      - {"id": "c", "text": "vớt"}
    answer: {"correct": ["c"]}
    hint: "Đọc to từng tiếng và nghe phần cuối của tiếng."
    explanation: "Tiếng \"vớt\" có vần ơt."

  - id: "b10"
    type: "exercise"
    kind: "order"
    points: 10
    skill: "ghep-tieng-coot"
