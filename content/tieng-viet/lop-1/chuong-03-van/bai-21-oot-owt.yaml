schema: 1
slug: "tv1-van-21-oot-owt"
title: "Vần ôt – ơt"
summary: "Học vần ôt và ơt; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ôt và ơt. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ôt**: ghép âm đầu với vần để được tiếng.
      - **c** + **ôt** → **cột**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "c", "rhyme": "ôt", "tones": ["sắc", "nặng"], "caption": "Ghép c + ôt rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b4"
    type: "text"
    markdown: |
      Vần **ơt**: ghép âm đầu với vần để được tiếng.
      - **v** + **ơt** → **vớt**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config: {"onset": "v", "rhyme": "ơt", "tones": ["sắc", "nặng"], "caption": "Ghép v + ơt rồi thử đổi dấu thanh để nghe các tiếng khác nhau."}

  - id: "b6"
    type: "interactive"
    kind: "flashcards"
    config:
      lang: "vi"
      cards:
        - {"word": "cột", "emoji": "🏛️"}
        - {"word": "sốt", "emoji": "🤒"}
        - {"word": "tốt", "emoji": "👍"}
        - {"word": "vớt", "emoji": "🎣"}
        - {"word": "ớt", "emoji": "🌶️"}
        - {"word": "rớt", "emoji": "🍂"}
      caption: "Chạm vào từng thẻ để nghe các từ có vần ôt và ơt."

  - id: "b7"
    type: "callout"
    variant: "remember"
    markdown: "Tiếng có vần **ôt** hoặc **ơt**: **cột**, **sốt**, **tốt**, **vớt**, **ớt**."

  - id: "b8"
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "tim-tieng-co-van-oot"
    prompt: "Tiếng nào có vần **ôt**?"
