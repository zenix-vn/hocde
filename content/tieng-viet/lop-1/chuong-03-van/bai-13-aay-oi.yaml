title: "Vần ây – oi"
summary: "Học vần ây và oi; ghép âm đầu với vần để đọc tiếng."
est_minutes: 8
xp_reward: 25
status: "published"
blocks:
  - id: "b1"
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay mình học vần mới: ây và oi. Bé nghe, đọc và ghép tiếng cùng mình nhé!"

  - id: "b2"
    type: "text"
    markdown: |
      Vần **ây**: ghép âm đầu với vần để được tiếng.
      - **c** + **ây** → **cây**

  - id: "b3"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "c"
      rhyme: "ây"
      tones: ["ngang", "huyền", "sắc", "hỏi", "ngã", "nặng"]
      caption: "Ghép c + ây rồi thử đổi dấu thanh để nghe các tiếng khác nhau."

  - id: "b4"
    type: "text"
    markdown: |
      Vần **oi**: ghép âm đầu với vần để được tiếng.
      - **v** + **oi** → **voi**

  - id: "b5"
    type: "interactive"
    kind: "syllable_builder"
    config:
      onset: "v"
      rhyme: "oi"
