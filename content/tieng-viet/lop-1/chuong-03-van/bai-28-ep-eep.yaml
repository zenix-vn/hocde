    options:
      - {"id": "a", "text": "chim"}
      - {"id": "b", "text": "xếp"}
      - {"id": "c", "text": "lúa"}
    answer: {"correct": ["b"]}
    hint: "Bấm nút loa để nghe lại."
    explanation: "Bé đã nghe tiếng \"xếp\"."

  - id: "b14"
    type: "exercise"
    kind: "match"
    points: 10
    skill: "noi-hinh-voi-tu-ep"
    prompt: "Nối hình với từ:"
    pairs:
      - {"left": "🩴", "right": "dép"}
      - {"left": "📎", "right": "kẹp"}
      - {"left": "✍️", "right": "chép"}
    answer: {"pairs": [["🩴", "dép"], ["📎", "kẹp"], ["✍️", "chép"]]}
    hint: "Nhìn hình rồi đọc to từ để chọn."
    explanation: "Bé đã nối đúng các từ vừa học."

  - id: "b15"
    type: "summary"
    markdown: "Hôm nay bé biết vần **ep và êp** và đọc được: dép, kẹp, chép, bếp, xếp, nếp. Giỏi quá!"
