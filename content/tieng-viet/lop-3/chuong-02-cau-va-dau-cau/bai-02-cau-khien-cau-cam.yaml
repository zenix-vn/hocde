      **Câu khiến** dùng để nhờ, yêu cầu, đề nghị. Ví dụ: Em hãy xếp hàng ngay ngắn.

      **Câu cảm** bày tỏ cảm xúc. Ví dụ: Ôi, bông hoa đẹp quá!

