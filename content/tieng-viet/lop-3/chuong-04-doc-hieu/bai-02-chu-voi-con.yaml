    prompt: "Voi con gặp chuyện gì?"
    options:
      - { id: "a", text: "Lạc mẹ" }
      - { id: "b", text: "Bị ốm" }
      - { id: "c", text: "Đi học muộn" }
    answer: { correct: ["a"] }
    hint: "Câu đầu."
    explanation: "Lạc mẹ."

