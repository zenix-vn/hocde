    markdown: |
      **Chú voi con**

      Voi con lạc mẹ giữa rừng. Trời tối dần, voi con run rẩy. Bác khỉ nghe tiếng khóc liền chạy tới hỏi han. Bác dẫn voi con đi qua suối, vượt đồi. Cuối cùng, voi con gặp lại mẹ. Voi con cảm ơn bác khỉ rối rít.

