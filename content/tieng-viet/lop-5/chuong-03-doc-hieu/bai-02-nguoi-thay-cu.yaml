    prompt: "Dấu ngoặc kép trong bài đánh dấu:"
    options:
      - { id: "a", text: "lời nói trực tiếp" }
      - { id: "b", text: "tên riêng" }
      - { id: "c", text: "chú thích" }
    answer: { correct: ["a"] }
    hint: "Lời cựu học sinh."
    explanation: "Lời nói trực tiếp."

