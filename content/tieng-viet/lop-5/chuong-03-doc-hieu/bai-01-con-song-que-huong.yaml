  - id: b1
    type: "text"
    markdown: |
      **Con sông quê hương**

      Con sông chảy qua làng em hiền hòa như một dải lụa mềm. Buổi sáng, mặt sông phủ làn sương mỏng. Trưa đến, nước sông xanh trong, in bóng mây trời. Chiều về, những chiếc thuyền chài nhẹ nhàng lướt trên sóng. Dù đi xa đến đâu, em cũng không quên hình ảnh dòng sông thân yêu ấy.

  - id: b2
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "doc-hieu"
    prompt: "Con sông được so sánh với:"
    options:
      - { id: "a", text: "tấm gương" }
      - { id: "b", text: "dải lụa mềm" }
      - { id: "c", text: "con đường" }
    answer: { correct: ["b"] }
    hint: "Câu đầu."
    explanation: "Dải lụa mềm."

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "doc-hieu"
    prompt: "Buổi sáng, mặt sông có gì?"
    options:
      - { id: "a", text: "Nhiều thuyền" }
      - { id: "b", text: "Sóng lớn" }
      - { id: "c", text: "Làn sương mỏng" }
    answer: { correct: ["c"] }
    hint: "Câu thứ hai."
    explanation: "Sương mỏng."

  - id: b4
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "doc-hieu"
    prompt: "Chiều về, trên sông có gì?"
