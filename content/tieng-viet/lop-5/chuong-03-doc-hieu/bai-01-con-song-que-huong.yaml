      - { id: "b", text: "Tàu lớn" }
      - { id: "c", text: "Thuyền chài lướt nhẹ" }
    answer: { correct: ["c"] }
    hint: "Câu thứ tư."
    explanation: "Thuyền chài."

  - id: b5
