  - id: b2
    type: "text"
    markdown: |
      **Chú mèo Mướp**

      Nhà em nuôi một chú mèo tên là Mướp. Bộ lông của Mướp vằn vện như con hổ nhỏ. Đôi mắt Mướp sáng long lanh. Ban ngày, Mướp nằm phơi nắng ngoài hiên. Ban đêm, Mướp rình bắt chuột. Cả nhà ai cũng quý Mướp.

