    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "doc-hieu"
    prompt: "Chú mèo tên là gì?"
    options:
      - { id: "a", text: "Mướp" }
      - { id: "b", text: "Vằn" }
      - { id: "c", text: "Miu" }
    answer: { correct: ["a"] }
    hint: "Câu đầu."
    explanation: "Mướp."

  - id: b4
    type: "exercise"
