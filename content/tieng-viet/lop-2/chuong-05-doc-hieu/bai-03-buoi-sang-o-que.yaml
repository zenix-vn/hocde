    markdown: |
      **Buổi sáng ở quê**

      Trời vừa sáng, tiếng gà gáy vang khắp xóm. Sương trắng giăng mỏng trên cánh đồng lúa xanh. Ông em vác cuốc ra thăm ruộng. Bà em ngồi nhóm bếp nấu cơm. Mùi khói bếp thơm lừng bay khắp sân. Buổi sáng ở quê thật yên bình.

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "doc-hieu"
    prompt: "Buổi sáng, tiếng gì vang khắp xóm?"
    options:
      - { id: "a", text: "Tiếng gà gáy" }
      - { id: "b", text: "Tiếng còi xe" }
      - { id: "c", text: "Tiếng chuông" }
    answer: { correct: ["a"] }
    hint: "Câu đầu."
    explanation: "Tiếng gà gáy."

  - id: b4
