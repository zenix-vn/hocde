    text: "Bé nhớ: khi đứng trước i, e, ê thì viết k, gh, ngh nhé!"

  - id: b2
    type: "text"
    markdown: |
      **k, gh, ngh** đứng trước **i, e, ê**:

      kể chuyện, kì lạ · ghế, ghi nhớ · nghỉ, nghề, nghe

      **c, g, ng** đứng trước các chữ còn lại:

      con cá, cô giáo · gà, gấu · ngày, ngủ

