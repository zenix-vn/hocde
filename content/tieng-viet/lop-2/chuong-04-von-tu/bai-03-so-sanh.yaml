blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Khi nói \"đôi mắt như hạt nhãn\", bé đang dùng cách so sánh!"

  - id: b2
    type: "text"
    markdown: |
      So sánh là đặt hai sự vật cạnh nhau để thấy chúng giống nhau.

      - Trăng tròn **như** quả bóng.
      - Tóc bà trắng **như** bông.
      - Má bé hồng **như** quả đào.

      Từ so sánh thường dùng: **như, là**.

  - id: b3
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "so-sanh"
    prompt: "Câu nào có hình ảnh so sánh?"
    options:
      - { id: "a", text: "Mặt trời đỏ như quả cà chua chín." }
      - { id: "b", text: "Mặt trời mọc hướng Đông." }
      - { id: "c", text: "Mặt trời lên rồi." }
    answer: { correct: ["a"] }
    hint: "Có từ \"như\"."
    explanation: "Câu đầu so sánh mặt trời với quả cà chua."

  - id: b4
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "so-sanh"
    prompt: "Quả bóng tròn _ mặt trăng."
    answer: { accept: ["như"] }
    hint: "Từ nối hai sự vật giống nhau."
    explanation: "tròn như mặt trăng."

