    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-jump"
    prompt: "Nghe và chọn đáp án đúng."
    listen: { text: "jump", lang: "en" }
    options:
      - { id: "a", text: "🏊", say: "swim", lang: "en" }
      - { id: "b", text: "🤸", say: "jump", lang: "en" }
      - { id: "c", text: "🏃", say: "run", lang: "en" }
    answer: { correct: ["b"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là jump."

