  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **I can swim.** Mình biết bơi.

      **I can't fly.** Mình không biết bay.

      **Can you sing? Yes, I can. / No, I can't.**
    say: [{"t":"I can swim.","l":"en"},{"t":"I can't fly.","l":"en"}]

