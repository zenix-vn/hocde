    config: { lang: "en", caption: "Chạm vào từng thẻ để nghe và nhắc lại.", cards: [{ word: "swim", emoji: "🏊", meaning: "bơi" }, { word: "run", emoji: "🏃", meaning: "chạy" }, { word: "jump", emoji: "🤸", meaning: "nhảy" }, { word: "sing", emoji: "🎤", meaning: "hát" }, { word: "fly", emoji: "🕊️", meaning: "bay" }] }
