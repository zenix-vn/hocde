      **I _ fly.**
    answer: { accept: ["can't", "cannot"] }
    hint: "Nhìn lại phần ghi nhớ."
    explanation: "I can't fly."
    say: [{"t":"Điền: Mình không biết bay.","l":"vi"},{"t":"I blank fly.","l":"en"}]

