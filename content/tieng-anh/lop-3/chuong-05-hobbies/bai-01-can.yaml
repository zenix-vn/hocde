      **Can you sing?**
    options:
      - { id: "a", text: "Yes, I can." }
      - { id: "b", text: "No, I'm not." }
      - { id: "c", text: "I'm sing." }
    answer: { correct: ["a"] }
    hint: "Đọc kỹ rồi chọn đáp án."
    explanation: "Biết thì Yes, I can."
    option_lang: "en"
    say: [{"t":"Bạn biết hát. Trả lời:","l":"vi"},{"t":"Can you sing?","l":"en"}]

