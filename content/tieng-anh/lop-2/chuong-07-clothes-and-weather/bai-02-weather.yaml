    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-sunny"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "sunny", lang: "en" }
    options:
      - { id: "a", text: "☀️", say: "sunny", lang: "en" }
      - { id: "b", text: "🌧️", say: "rainy", lang: "en" }
      - { id: "c", text: "☁️", say: "cloudy", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là sunny."

  - id: b5
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-rainy"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "rainy", lang: "en" }
    options:
      - { id: "a", text: "☁️", say: "cloudy", lang: "en" }
      - { id: "b", text: "💨", say: "windy", lang: "en" }
      - { id: "c", text: "🌧️", say: "rainy", lang: "en" }
    answer: { correct: ["c"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là rainy."

  - id: b6
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "hoi-dap-en"
    prompt: |
      Hôm nay trời mưa 🌧️. Bé trả lời:

      **How's the weather?**
    options:
      - { id: "a", text: "It's rainy." }
      - { id: "b", text: "It's sunny." }
      - { id: "c", text: "I'm fine." }
    answer: { correct: ["a"] }
    hint: "Đọc kỹ câu hỏi, rồi chọn câu trả lời phù hợp."
    explanation: "rainy là có mưa."
    option_lang: "en"
    say: [{"t":"Hôm nay trời mưa 🌧️. Bé trả lời:","l":"vi"},{"t":"How's the weather?","l":"en"}]

  - id: b7
    type: "exercise"
    kind: "match"
    points: 10
    skill: "nghia-tu"
    prompt: "Nối từ với nghĩa."
    pairs:
      - { left: "sunny", right: "nắng" }
      - { left: "cloudy", right: "nhiều mây" }
      - { left: "windy", right: "có gió" }
    answer: { pairs: [["sunny", "nắng"], ["cloudy", "nhiều mây"], ["windy", "có gió"]] }
    hint: "Bé nghe lại từng từ ở thẻ trên."
    explanation: "sunny là nắng, cloudy là nhiều mây, windy là có gió."
    option_lang: "en"

  - id: b8
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-tu-sunny"
    prompt: |
      Điền từ: Trời nắng ☀️

      **It's _ .**
    answer: { accept: ["sunny"] }
    hint: "Nhìn lại ví dụ ở trên nhé."
    explanation: "It's sunny."
    say: [{"t":"Điền từ: Trời nắng ☀️","l":"vi"},{"t":"It's blank .","l":"en"}]

  - id: b9
    type: "exercise"
    kind: "order"
    points: 10
    skill: "sap-xep-cau-en"
    prompt: "Sắp xếp các từ thành câu."
    options:
      - { id: "xthe", text: "the" }
      - { id: "xHows", text: "How's" }
      - { id: "xweather", text: "weather" }
    answer: { sequence: ["xHows", "xthe", "xweather"] }
    hint: "Chữ cái đầu câu viết hoa."
    explanation: "How's the weather?"
    option_lang: "en"

  - id: b10
    type: "summary"
    markdown: "Bé đã biết nói về **thời tiết** bằng tiếng Anh."
