blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Hôm nay trời thế nào nhỉ? Mình nói về thời tiết nhé!"
    say: [{"t":"Hôm nay trời thế nào nhỉ? Mình nói về thời tiết nhé!","l":"vi"}]

  - id: b2
    type: "interactive"
    kind: "flashcards"
    config: { lang: "en", caption: "Bé chạm vào từng thẻ để nghe và nhắc lại.", cards: [{ word: "sunny", emoji: "☀️", meaning: "nắng" }, { word: "rainy", emoji: "🌧️", meaning: "mưa" }, { word: "cloudy", emoji: "☁️", meaning: "nhiều mây" }, { word: "windy", emoji: "💨", meaning: "có gió" }] }
    say: [{"t":"Bé chạm vào từng thẻ để nghe và nhắc lại.","l":"vi"}]

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **How's the weather?** – Thời tiết thế nào?

      **It's sunny.** – Trời nắng.

      **It's rainy.** – Trời mưa.
    say: [{"t":"How's the weather?","l":"en"},{"t":"Thời tiết thế nào?","l":"vi"},{"t":"It's sunny.","l":"en"},{"t":"Trời nắng.","l":"vi"}]

