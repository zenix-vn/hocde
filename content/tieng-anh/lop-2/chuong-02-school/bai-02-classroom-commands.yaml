    type: "exercise"
    kind: "match"
    points: 10
    skill: "nghia-tu"
    prompt: "Nối câu lệnh với nghĩa."
    pairs:
      - { left: "stand up", right: "đứng lên" }
      - { left: "sit down", right: "ngồi xuống" }
      - { left: "close your book", right: "đóng sách lại" }
    answer: { pairs: [["stand up", "đứng lên"], ["sit down", "ngồi xuống"], ["close your book", "đóng sách lại"]] }
    hint: "Bé nghe lại từng từ ở thẻ trên."
    explanation: "Nhớ lại các thẻ ở trên."
    option_lang: "en"

  - id: b8
    type: "exercise"
    kind: "order"
    points: 10
    skill: "sap-xep-cau-en"
    prompt: "Sắp xếp các từ thành câu."
    options:
      - { id: "xdown", text: "down" }
      - { id: "xSit", text: "Sit" }
    answer: { sequence: ["xSit", "xdown"] }
    hint: "Chữ cái đầu câu viết hoa."
    explanation: "Sit down."
    option_lang: "en"

  - id: b9
    type: "summary"
    markdown: "Bé đã hiểu các **lời cô giáo** trong lớp bằng tiếng Anh."
