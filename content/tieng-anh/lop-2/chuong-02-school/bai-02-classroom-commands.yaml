    text: "Trong lớp học, cô giáo hay nói những câu này. Bé nghe và làm theo nhé!"
    say: [{"t":"Trong lớp học, cô giáo hay nói những câu này. Bé nghe và làm theo nhé!","l":"vi"}]

  - id: b2
    type: "interactive"
    kind: "flashcards"
    config: { lang: "en", caption: "Bé chạm vào từng thẻ để nghe và làm theo.", cards: [{ word: "stand up", emoji: "🧍", meaning: "đứng lên" }, { word: "sit down", emoji: "🪑", meaning: "ngồi xuống" }, { word: "open your book", emoji: "📖", meaning: "mở sách ra" }, { word: "close your book", emoji: "📕", meaning: "đóng sách lại" }] }
    say: [{"t":"Bé chạm vào từng thẻ để nghe và làm theo.","l":"vi"}]

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **Stand up!** Đứng lên!

      **Sit down!** Ngồi xuống!

      **Open your book.** Mở sách ra.

      **Close your book.** Đóng sách lại.
    say: [{"t":"Stand up!","l":"en"},{"t":"Đứng lên!","l":"vi"},{"t":"Sit down!","l":"en"},{"t":"Ngồi xuống!","l":"vi"}]

