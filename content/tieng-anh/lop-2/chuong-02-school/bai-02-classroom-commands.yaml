    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-stand-up"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "stand up", lang: "en" }
    options:
      - { id: "a", text: "🧍", say: "stand up", lang: "en" }
      - { id: "b", text: "🪑", say: "sit down", lang: "en" }
      - { id: "c", text: "📖", say: "open your book", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là stand up."

  - id: b5
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-sit-down"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "sit down", lang: "en" }
    options:
      - { id: "a", text: "📕", say: "close your book", lang: "en" }
      - { id: "b", text: "🪑", say: "sit down", lang: "en" }
      - { id: "c", text: "🧍", say: "stand up", lang: "en" }
    answer: { correct: ["b"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là sit down."

