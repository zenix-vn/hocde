    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nghia-m-s-ch-ra"
    prompt: "Cô nói \"Open your book.\" Bé làm gì?"
    options:
      - { id: "a", text: "mở sách ra" }
      - { id: "b", text: "đóng sách lại" }
      - { id: "c", text: "đứng lên" }
    answer: { correct: ["a"] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Open your book nghĩa là mở sách ra."
    option_lang: "en"

