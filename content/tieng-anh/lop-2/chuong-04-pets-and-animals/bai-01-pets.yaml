title: "My pets"
summary: "Nói về thú cưng: I have a dog."
est_minutes: 8
xp_reward: 25
status: published
blocks:
  - id: b1
    type: "mascot_say"
    mascot: "fox"
    mood: "happy"
    text: "Bé có nuôi con vật nào không? Mình cùng nói về thú cưng nhé!"
    say: [{"t":"Bé có nuôi con vật nào không? Mình cùng nói về thú cưng nhé!","l":"vi"}]

  - id: b2
    type: "interactive"
    kind: "flashcards"
    config: { lang: "en", caption: "Bé chạm vào từng thẻ để nghe và nhắc lại.", cards: [{ word: "dog", emoji: "🐶", meaning: "con chó" }, { word: "cat", emoji: "🐱", meaning: "con mèo" }, { word: "bird", emoji: "🐦", meaning: "con chim" }, { word: "fish", emoji: "🐟", meaning: "con cá" }, { word: "rabbit", emoji: "🐰", meaning: "con thỏ" }] }
    say: [{"t":"Bé chạm vào từng thẻ để nghe và nhắc lại.","l":"vi"}]

  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **I have a dog.** – Mình có một con chó.

      **Do you have a cat?** – Bạn có một con mèo không?
    say: [{"t":"I have a dog.","l":"en"},{"t":"Mình có một con chó.","l":"vi"},{"t":"Do you have a cat?","l":"en"},{"t":"Bạn có một con mèo không?","l":"vi"}]

  - id: b4
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-rabbit"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "rabbit", lang: "en" }
    options:
      - { id: "a", text: "🐰", say: "rabbit", lang: "en" }
      - { id: "b", text: "🐶", say: "dog", lang: "en" }
      - { id: "c", text: "🐟", say: "fish", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là rabbit."

  - id: b5
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-bird"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "bird", lang: "en" }
    options:
      - { id: "a", text: "🐱", say: "cat", lang: "en" }
      - { id: "b", text: "🐟", say: "fish", lang: "en" }
      - { id: "c", text: "🐦", say: "bird", lang: "en" }
    answer: { correct: ["c"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là bird."

  - id: b6
    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nghia-cat"
    prompt: "Con mèo 🐱 tiếng Anh là gì?"
    options:
      - { id: "a", text: "dog" }
      - { id: "b", text: "cat" }
      - { id: "c", text: "bird" }
    answer: { correct: ["b"] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Con mèo tiếng Anh là cat."
    option_lang: "en"

  - id: b7
    type: "exercise"
    kind: "match"
    points: 10
    skill: "nghia-tu"
    prompt: "Nối con vật với tên tiếng Anh."
    pairs:
      - { left: "con chó", right: "dog" }
      - { left: "con cá", right: "fish" }
      - { left: "con thỏ", right: "rabbit" }
    answer: { pairs: [["con chó", "dog"], ["con cá", "fish"], ["con thỏ", "rabbit"]] }
    hint: "Bé nghe lại từng từ ở thẻ trên."
    explanation: "Con chó là dog, con cá là fish, con thỏ là rabbit."
    option_lang: "en"

  - id: b8
    type: "exercise"
    kind: "fill_blank"
    points: 10
    skill: "dien-tu-bird"
    prompt: |
      Điền từ: Mình có một con chim 🐦

      **I have a _ .**
    answer: { accept: ["bird"] }
    hint: "Nhìn lại ví dụ ở trên nhé."
    explanation: "I have a bird."
    say: [{"t":"Điền từ: Mình có một con chim 🐦","l":"vi"},{"t":"I have a blank .","l":"en"}]

  - id: b9
    type: "exercise"
    kind: "order"
    points: 10
    skill: "sap-xep-cau-en"
    prompt: "Sắp xếp các từ thành câu."
    options:
      - { id: "xhave", text: "have" }
      - { id: "xI", text: "I" }
      - { id: "xa", text: "a" }
      - { id: "xcat", text: "cat" }
    answer: { sequence: ["xI", "xhave", "xa", "xcat"] }
    hint: "Chữ cái đầu câu viết hoa."
    explanation: "I have a cat."
    option_lang: "en"

  - id: b10
    type: "summary"
    markdown: "Bé đã biết nói về **thú cưng** bằng tiếng Anh."
    say: "Bé đã biết nói về thú cưng bằng tiếng Anh. I have a dog."
