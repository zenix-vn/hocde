      **It can _ .**
    answer: { accept: ["climb"] }
    hint: "Nhìn lại ví dụ ở trên nhé."
    explanation: "It can climb."
    say: [{"t":"Điền từ: Con khỉ 🐵 leo cây được.","l":"vi"},{"t":"It can blank .","l":"en"}]

