  - id: b3
    type: "callout"
    variant: "remember"
    markdown: |
      **It's an elephant.** – Đó là một con voi.

      **It can run.** – Nó chạy được.

      **Can it swim?** – Nó bơi được không?
    say: [{"t":"It's an elephant.","l":"en"},{"t":"Đó là một con voi.","l":"vi"},{"t":"It can run.","l":"en"},{"t":"Nó chạy được.","l":"vi"}]

