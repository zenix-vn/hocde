    points: 10
    skill: "nghe-lion"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "lion", lang: "en" }
    options:
      - { id: "a", text: "🦁", say: "lion", lang: "en" }
      - { id: "b", text: "🐯", say: "tiger", lang: "en" }
      - { id: "c", text: "🐘", say: "elephant", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là lion."

  - id: b5
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-monkey"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "monkey", lang: "en" }
    options:
      - { id: "a", text: "🦒", say: "giraffe", lang: "en" }
      - { id: "b", text: "🐘", say: "elephant", lang: "en" }
      - { id: "c", text: "🐵", say: "monkey", lang: "en" }
    answer: { correct: ["c"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là monkey."

