    options:
      - { id: "xlion", text: "lion" }
      - { id: "xIts", text: "It's" }
      - { id: "xa", text: "a" }
    answer: { sequence: ["xIts", "xa", "xlion"] }
    hint: "Chữ cái đầu câu viết hoa."
    explanation: "It's a lion."
    option_lang: "en"

  - id: b10
    type: "summary"
    markdown: "Bé đã biết gọi tên **con vật ở sở thú**."
