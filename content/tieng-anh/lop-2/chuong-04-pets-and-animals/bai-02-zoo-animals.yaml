    type: "exercise"
    kind: "match"
    points: 10
    skill: "nghia-tu"
    prompt: "Nối từ với nghĩa."
    pairs:
      - { left: "tiger", right: "con hổ" }
      - { left: "giraffe", right: "hươu cao cổ" }
      - { left: "monkey", right: "con khỉ" }
    answer: { pairs: [["tiger", "con hổ"], ["giraffe", "hươu cao cổ"], ["monkey", "con khỉ"]] }
    hint: "Bé nghe lại từng từ ở thẻ trên."
    explanation: "tiger là hổ, giraffe là hươu cao cổ, monkey là khỉ."
    option_lang: "en"

