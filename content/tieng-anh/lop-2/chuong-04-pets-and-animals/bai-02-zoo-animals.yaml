    config: { lang: "en", caption: "Bé chạm vào từng thẻ để nghe và nhắc lại.", cards: [{ word: "elephant", emoji: "🐘", meaning: "con voi" }, { word: "monkey", emoji: "🐵", meaning: "con khỉ" }, { word: "lion", emoji: "🦁", meaning: "sư tử" }, { word: "tiger", emoji: "🐯", meaning: "con hổ" }, { word: "giraffe", emoji: "🦒", meaning: "hươu cao cổ" }] }
