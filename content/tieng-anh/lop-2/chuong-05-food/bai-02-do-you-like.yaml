    markdown: |
      **Do you like cake?** – Bạn có thích bánh không?

      **Yes, I do.** – Có, mình thích.

      **No, I don't.** – Không, mình không thích.
    say: [{"t":"Do you like cake?","l":"en"},{"t":"Bạn có thích bánh không?","l":"vi"},{"t":"Yes, I do.","l":"en"},{"t":"Có, mình thích.","l":"vi"}]

