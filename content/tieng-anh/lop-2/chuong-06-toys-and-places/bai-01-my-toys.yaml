    type: "exercise"
    kind: "order"
    points: 10
    skill: "sap-xep-cau-en"
    prompt: "Sắp xếp các từ thành câu."
    options:
      - { id: "xis", text: "is" }
      - { id: "xmy", text: "my" }
      - { id: "xThis", text: "This" }
      - { id: "xrobot", text: "robot" }
    answer: { sequence: ["xThis", "xis", "xmy", "xrobot"] }
    hint: "Chữ cái đầu câu viết hoa."
    explanation: "This is my robot."
    option_lang: "en"

  - id: b10
    type: "summary"
    markdown: "Bé đã biết gọi tên **đồ chơi** bằng tiếng Anh."
    say: "Bé đã biết gọi tên đồ chơi bằng tiếng Anh. I have a ball."
