      **I have a _ .**
    answer: { accept: ["car"] }
    hint: "Nhìn lại ví dụ ở trên nhé."
    explanation: "I have a car."
    say: [{"t":"Điền từ: Mình có một xe ô tô 🚗","l":"vi"},{"t":"I have a blank .","l":"en"}]

