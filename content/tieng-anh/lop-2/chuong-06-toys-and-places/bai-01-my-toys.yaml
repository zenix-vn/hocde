    type: "exercise"
    kind: "mcq"
    points: 10
    skill: "nghia-doll"
    prompt: "Búp bê 🪆 tiếng Anh là gì?"
    options:
      - { id: "a", text: "doll" }
      - { id: "b", text: "ball" }
      - { id: "c", text: "car" }
    answer: { correct: ["a"] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Búp bê tiếng Anh là doll."
    option_lang: "en"

  - id: b7
    type: "exercise"
    kind: "match"
    points: 10
    skill: "nghia-tu"
    prompt: "Nối từ với nghĩa."
    pairs:
      - { left: "ball", right: "quả bóng" }
      - { left: "kite", right: "con diều" }
      - { left: "car", right: "xe ô tô" }
    answer: { pairs: [["ball", "quả bóng"], ["kite", "con diều"], ["car", "xe ô tô"]] }
    hint: "Bé nghe lại từng từ ở thẻ trên."
    explanation: "ball là bóng, kite là diều, car là xe ô tô."
    option_lang: "en"

