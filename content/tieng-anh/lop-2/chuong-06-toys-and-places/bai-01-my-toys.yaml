    markdown: |
      **I have a ball.** – Mình có một quả bóng.

      **This is my robot.** – Đây là người máy của mình.
    say: [{"t":"I have a ball.","l":"en"},{"t":"Mình có một quả bóng.","l":"vi"},{"t":"This is my robot.","l":"en"},{"t":"Đây là người máy của mình.","l":"vi"}]

