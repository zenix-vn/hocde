    points: 10
    skill: "nghe-kite"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "kite", lang: "en" }
    options:
      - { id: "a", text: "🪁", say: "kite", lang: "en" }
      - { id: "b", text: "⚽", say: "ball", lang: "en" }
      - { id: "c", text: "🚗", say: "car", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là kite."

  - id: b5
    type: "exercise"
    kind: "listen_choose"
    points: 10
    skill: "nghe-robot"
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "robot", lang: "en" }
    options:
      - { id: "a", text: "🪆", say: "doll", lang: "en" }
      - { id: "b", text: "🤖", say: "robot", lang: "en" }
      - { id: "c", text: "🚗", say: "car", lang: "en" }
    answer: { correct: ["b"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là robot."

