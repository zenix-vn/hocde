    markdown: "Ghi nhớ: **apple** (quả táo (chữ A)) · **ball** (quả bóng (chữ B)) · **cat** (con mèo (chữ C)) · **dog** (con chó (chữ D)) · **egg** (quả trứng (chữ E))"
