      - { id: b, text: "⚽", say: "ball", lang: en }
      - { id: c, text: "🐱", say: "cat", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là apple, nghĩa là quả táo (chữ A)."

