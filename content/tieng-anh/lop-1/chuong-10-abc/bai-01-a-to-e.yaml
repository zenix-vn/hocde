    type: mascot_say
    mascot: fox
    mood: happy
    text: "Mỗi chữ cái bắt đầu một từ tiếng Anh. Mình cùng nghe nhé!"
    say:
      - { t: "Mỗi chữ cái bắt đầu một từ tiếng Anh. Mình cùng nghe nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "apple", emoji: "🍎", meaning: "quả táo (chữ A)" }
        - { word: "ball", emoji: "⚽", meaning: "quả bóng (chữ B)" }
        - { word: "cat", emoji: "🐱", meaning: "con mèo (chữ C)" }
        - { word: "dog", emoji: "🐶", meaning: "con chó (chữ D)" }
        - { word: "egg", emoji: "🥚", meaning: "quả trứng (chữ E)" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

