    mascot: fox
    mood: happy
    text: "Mình đi tiếp từ chữ K nhé!"
    say:
      - { t: "Mình đi tiếp từ chữ K nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
