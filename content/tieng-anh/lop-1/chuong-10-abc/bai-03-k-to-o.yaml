      cards:
        - { word: "kite", emoji: "🪁", meaning: "con diều (chữ K)" }
        - { word: "lion", emoji: "🦁", meaning: "sư tử (chữ L)" }
        - { word: "monkey", emoji: "🐵", meaning: "con khỉ (chữ M)" }
        - { word: "nose", emoji: "👃", meaning: "cái mũi (chữ N)" }
