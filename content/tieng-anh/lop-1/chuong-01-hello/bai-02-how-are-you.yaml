    type: callout
    variant: remember
    markdown: "Ghi nhớ: **fine** (khỏe) · **thank you** (cảm ơn) · **sorry** (xin lỗi) · **please** (làm ơn)"
    say: [{ t: "fine", l: en }, { t: "khỏe", l: vi }, { t: "thank you", l: en }, { t: "cảm ơn", l: vi }, { t: "sorry", l: en }, { t: "xin lỗi", l: vi }, { t: "please", l: en }, { t: "làm ơn", l: vi }]

