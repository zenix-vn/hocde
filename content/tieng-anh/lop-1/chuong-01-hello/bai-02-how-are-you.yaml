schema: 1
slug: anh1-how-are-you
title: "How are you?"
summary: "Hỏi thăm và cảm ơn: fine, thank you, sorry."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Hôm nay mình học cách hỏi thăm và nói cảm ơn nhé!"
    say:
      - { t: "Hôm nay mình học cách hỏi thăm và nói cảm ơn nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "fine", emoji: "😊", meaning: "khỏe" }
        - { word: "thank you", emoji: "🙏", meaning: "cảm ơn" }
        - { word: "sorry", emoji: "😔", meaning: "xin lỗi" }
        - { word: "please", emoji: "🤲", meaning: "làm ơn" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

