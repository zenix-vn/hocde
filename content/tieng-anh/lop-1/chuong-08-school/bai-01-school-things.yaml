    kind: match
    points: 10
    skill: nghia-tu
    prompt: "Nối từ tiếng Anh với nghĩa tiếng Việt."
    option_lang: en
    pairs:
      - { left: "book", right: "quyển sách" }
      - { left: "pen", right: "cái bút mực" }
      - { left: "pencil", right: "bút chì" }
      - { left: "bag", right: "cái cặp" }
    answer: { pairs: [["book", "quyển sách"], ["pen", "cái bút mực"], ["pencil", "bút chì"], ["bag", "cái cặp"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "book là quyển sách; pen là cái bút mực; pencil là bút chì; bag là cái cặp."

