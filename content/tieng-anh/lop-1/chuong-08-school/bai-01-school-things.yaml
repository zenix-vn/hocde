schema: 1
slug: anh1-school-1
title: "School things"
summary: "Đồ dùng học tập: book, pen, pencil, bag."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Bé có gì trong cặp sách nào? Mình học tên nhé!"
    say:
      - { t: "Bé có gì trong cặp sách nào? Mình học tên nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "book", emoji: "📖", meaning: "quyển sách" }
        - { word: "pen", emoji: "🖊️", meaning: "cái bút mực" }
        - { word: "pencil", emoji: "✏️", meaning: "bút chì" }
        - { word: "bag", emoji: "🎒", meaning: "cái cặp" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

  - id: b3
    type: callout
    variant: remember
    markdown: "Ghi nhớ: **book** (quyển sách) · **pen** (cái bút mực) · **pencil** (bút chì) · **bag** (cái cặp)"
    say: [{ t: "book", l: en }, { t: "quyển sách", l: vi }, { t: "pen", l: en }, { t: "cái bút mực", l: vi }, { t: "pencil", l: en }, { t: "bút chì", l: vi }, { t: "bag", l: en }, { t: "cái cặp", l: vi }]

  - id: b4
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-book
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "book", lang: en }
    options:
      - { id: a, text: "📖", say: "book", lang: en }
      - { id: b, text: "🖊️", say: "pen", lang: en }
      - { id: c, text: "✏️", say: "pencil", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là book, nghĩa là quyển sách."

  - id: b5
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-pen
