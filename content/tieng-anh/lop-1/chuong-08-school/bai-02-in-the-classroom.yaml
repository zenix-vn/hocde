    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "ruler", emoji: "📏", meaning: "cái thước" }
        - { word: "eraser", emoji: "🧽", meaning: "cục tẩy" }
        - { word: "desk", emoji: "🪑", meaning: "cái bàn học" }
