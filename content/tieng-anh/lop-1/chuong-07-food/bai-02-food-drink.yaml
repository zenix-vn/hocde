schema: 1
slug: anh1-food-drink
title: "Food and drink"
summary: "Đồ ăn uống: milk, bread, cake, egg."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Đói bụng rồi! Mình học tên đồ ăn nhé."
    say:
      - { t: "Đói bụng rồi! Mình học tên đồ ăn nhé. Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "milk", emoji: "🥛", meaning: "sữa" }
        - { word: "bread", emoji: "🍞", meaning: "bánh mì" }
        - { word: "cake", emoji: "🍰", meaning: "bánh ngọt" }
        - { word: "egg", emoji: "🥚", meaning: "quả trứng" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

  - id: b3
    type: callout
    variant: remember
    markdown: "Ghi nhớ: **milk** (sữa) · **bread** (bánh mì) · **cake** (bánh ngọt) · **egg** (quả trứng)"
    say: [{ t: "milk", l: en }, { t: "sữa", l: vi }, { t: "bread", l: en }, { t: "bánh mì", l: vi }, { t: "cake", l: en }, { t: "bánh ngọt", l: vi }, { t: "egg", l: en }, { t: "quả trứng", l: vi }]

  - id: b4
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-milk
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "milk", lang: en }
    options:
      - { id: a, text: "🥛", say: "milk", lang: en }
      - { id: b, text: "🍞", say: "bread", lang: en }
      - { id: c, text: "🍰", say: "cake", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là milk, nghĩa là sữa."

  - id: b5
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-bread
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "bread", lang: en }
    options:
      - { id: a, text: "🍰", say: "cake", lang: en }
      - { id: b, text: "🍞", say: "bread", lang: en }
      - { id: c, text: "🥚", say: "egg", lang: en }
    answer: { correct: [b] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là bread, nghĩa là bánh mì."

  - id: b6
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-cake
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "cake", lang: en }
    options:
      - { id: a, text: "🥚", say: "egg", lang: en }
      - { id: b, text: "🥛", say: "milk", lang: en }
      - { id: c, text: "🍰", say: "cake", lang: en }
    answer: { correct: [c] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là cake, nghĩa là bánh ngọt."

  - id: b7
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-egg
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "egg", lang: en }
    options:
      - { id: a, text: "🥚", say: "egg", lang: en }
      - { id: b, text: "🥛", say: "milk", lang: en }
      - { id: c, text: "🍞", say: "bread", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là egg, nghĩa là quả trứng."

  - id: b8
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-cake
    prompt: "Bánh ngọt tiếng Anh là gì? 🍰"
    option_lang: en
    options:
      - { id: a, text: "cake" }
      - { id: b, text: "egg" }
      - { id: c, text: "milk" }
    answer: { correct: [a] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Bánh ngọt tiếng Anh là cake."

  - id: b9
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-egg
    prompt: "Quả trứng tiếng Anh là gì? 🥚"
    option_lang: en
    options:
      - { id: a, text: "milk" }
      - { id: b, text: "egg" }
      - { id: c, text: "bread" }
    answer: { correct: [b] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Quả trứng tiếng Anh là egg."

  - id: b10
    type: exercise
    kind: match
    points: 10
    skill: nghia-tu
    prompt: "Nối từ tiếng Anh với nghĩa tiếng Việt."
    option_lang: en
    pairs:
      - { left: "milk", right: "sữa" }
      - { left: "bread", right: "bánh mì" }
      - { left: "cake", right: "bánh ngọt" }
      - { left: "egg", right: "quả trứng" }
    answer: { pairs: [["milk", "sữa"], ["bread", "bánh mì"], ["cake", "bánh ngọt"], ["egg", "quả trứng"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "milk là sữa; bread là bánh mì; cake là bánh ngọt; egg là quả trứng."

  - id: b11
    type: summary
    markdown: "Bé đã biết **milk**, **bread**, **cake**, **egg**. Giỏi lắm!"
    say:
      - { t: "Bé đã biết", l: vi }
      - { t: "milk, bread, cake, egg.", l: en }
      - { t: "Giỏi lắm!", l: vi }

