schema: 1
slug: anh1-more-animals
title: "More animals"
summary: "Thêm các con vật: bird, rabbit, monkey, elephant."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Còn nhiều con vật khác đang chờ bé đó!"
    say:
      - { t: "Còn nhiều con vật khác đang chờ bé đó! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "bird", emoji: "🐦", meaning: "con chim" }
        - { word: "rabbit", emoji: "🐰", meaning: "con thỏ" }
        - { word: "monkey", emoji: "🐵", meaning: "con khỉ" }
        - { word: "elephant", emoji: "🐘", meaning: "con voi" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

  - id: b3
    type: callout
    variant: remember
    markdown: "Ghi nhớ: **bird** (con chim) · **rabbit** (con thỏ) · **monkey** (con khỉ) · **elephant** (con voi)"
    say: [{ t: "bird", l: en }, { t: "con chim", l: vi }, { t: "rabbit", l: en }, { t: "con thỏ", l: vi }, { t: "monkey", l: en }, { t: "con khỉ", l: vi }, { t: "elephant", l: en }, { t: "con voi", l: vi }]

  - id: b4
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-bird
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "bird", lang: en }
    options:
      - { id: a, text: "🐦", say: "bird", lang: en }
      - { id: b, text: "🐰", say: "rabbit", lang: en }
      - { id: c, text: "🐵", say: "monkey", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là bird, nghĩa là con chim."

  - id: b5
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-rabbit
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "rabbit", lang: en }
    options:
      - { id: a, text: "🐵", say: "monkey", lang: en }
      - { id: b, text: "🐰", say: "rabbit", lang: en }
      - { id: c, text: "🐘", say: "elephant", lang: en }
    answer: { correct: [b] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là rabbit, nghĩa là con thỏ."

  - id: b6
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-monkey
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "monkey", lang: en }
    options:
      - { id: a, text: "🐘", say: "elephant", lang: en }
      - { id: b, text: "🐦", say: "bird", lang: en }
      - { id: c, text: "🐵", say: "monkey", lang: en }
    answer: { correct: [c] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là monkey, nghĩa là con khỉ."

  - id: b7
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-elephant
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "elephant", lang: en }
    options:
      - { id: a, text: "🐘", say: "elephant", lang: en }
      - { id: b, text: "🐦", say: "bird", lang: en }
      - { id: c, text: "🐰", say: "rabbit", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là elephant, nghĩa là con voi."

  - id: b8
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-monkey
    prompt: "Con khỉ tiếng Anh là gì? 🐵"
    option_lang: en
    options:
      - { id: a, text: "monkey" }
      - { id: b, text: "elephant" }
      - { id: c, text: "bird" }
    answer: { correct: [a] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Con khỉ tiếng Anh là monkey."

  - id: b9
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-elephant
    prompt: "Con voi tiếng Anh là gì? 🐘"
    option_lang: en
    options:
      - { id: a, text: "bird" }
      - { id: b, text: "elephant" }
      - { id: c, text: "rabbit" }
    answer: { correct: [b] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Con voi tiếng Anh là elephant."

  - id: b10
    type: exercise
    kind: match
    points: 10
    skill: nghia-tu
    prompt: "Nối từ tiếng Anh với nghĩa tiếng Việt."
    option_lang: en
    pairs:
      - { left: "bird", right: "con chim" }
      - { left: "rabbit", right: "con thỏ" }
      - { left: "monkey", right: "con khỉ" }
      - { left: "elephant", right: "con voi" }
    answer: { pairs: [["bird", "con chim"], ["rabbit", "con thỏ"], ["monkey", "con khỉ"], ["elephant", "con voi"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "bird là con chim; rabbit là con thỏ; monkey là con khỉ; elephant là con voi."

  - id: b11
    type: summary
    markdown: "Bé đã biết **bird**, **rabbit**, **monkey**, **elephant**. Giỏi lắm!"
    say:
      - { t: "Bé đã biết", l: vi }
      - { t: "bird, rabbit, monkey, elephant.", l: en }
      - { t: "Giỏi lắm!", l: vi }

