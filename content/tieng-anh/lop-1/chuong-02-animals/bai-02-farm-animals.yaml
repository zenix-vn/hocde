schema: 1
slug: anh1-farm-animals
title: "Farm animals"
summary: "Con vật ở nông trại: duck, pig, cow, horse."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Mình cùng đến nông trại gặp các con vật nhé!"
    say:
      - { t: "Mình cùng đến nông trại gặp các con vật nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "duck", emoji: "🦆", meaning: "con vịt" }
        - { word: "pig", emoji: "🐷", meaning: "con lợn" }
        - { word: "cow", emoji: "🐮", meaning: "con bò" }
        - { word: "horse", emoji: "🐴", meaning: "con ngựa" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

  - id: b3
    type: callout
    variant: remember
    markdown: "Ghi nhớ: **duck** (con vịt) · **pig** (con lợn) · **cow** (con bò) · **horse** (con ngựa)"
    say: [{ t: "duck", l: en }, { t: "con vịt", l: vi }, { t: "pig", l: en }, { t: "con lợn", l: vi }, { t: "cow", l: en }, { t: "con bò", l: vi }, { t: "horse", l: en }, { t: "con ngựa", l: vi }]

  - id: b4
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-duck
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "duck", lang: en }
    options:
      - { id: a, text: "🦆", say: "duck", lang: en }
      - { id: b, text: "🐷", say: "pig", lang: en }
      - { id: c, text: "🐮", say: "cow", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là duck, nghĩa là con vịt."

