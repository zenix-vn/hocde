    pairs:
      - { left: "duck", right: "con vịt" }
      - { left: "pig", right: "con lợn" }
      - { left: "cow", right: "con bò" }
      - { left: "horse", right: "con ngựa" }
    answer: { pairs: [["duck", "con vịt"], ["pig", "con lợn"], ["cow", "con bò"], ["horse", "con ngựa"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "duck là con vịt; pig là con lợn; cow là con bò; horse là con ngựa."

  - id: b11
    type: summary
    markdown: "Bé đã biết **duck**, **pig**, **cow**, **horse**. Giỏi lắm!"
    say:
      - { t: "Bé đã biết", l: vi }
      - { t: "duck, pig, cow, horse.", l: en }
