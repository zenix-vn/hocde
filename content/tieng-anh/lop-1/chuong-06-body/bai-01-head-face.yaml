schema: 1
slug: anh1-body-1
title: "Head and face"
summary: "Đầu và khuôn mặt: head, eyes, ears, nose, mouth."
est_minutes: 8
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Mình cùng chỉ vào khuôn mặt của bé nhé!"
    say:
      - { t: "Mình cùng chỉ vào khuôn mặt của bé nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "head", emoji: "🧒", meaning: "cái đầu" }
        - { word: "eyes", emoji: "👀", meaning: "đôi mắt" }
        - { word: "ears", emoji: "👂", meaning: "đôi tai" }
        - { word: "nose", emoji: "👃", meaning: "cái mũi" }
        - { word: "mouth", emoji: "👄", meaning: "cái miệng" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

