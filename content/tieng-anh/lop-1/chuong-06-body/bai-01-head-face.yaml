    markdown: "Ghi nhớ: **head** (cái đầu) · **eyes** (đôi mắt) · **ears** (đôi tai) · **nose** (cái mũi) · **mouth** (cái miệng)"
    say: [{ t: "head", l: en }, { t: "cái đầu", l: vi }, { t: "eyes", l: en }, { t: "đôi mắt", l: vi }, { t: "ears", l: en }, { t: "đôi tai", l: vi }, { t: "nose", l: en }, { t: "cái mũi", l: vi }, { t: "mouth", l: en }, { t: "cái miệng", l: vi }]

