    type: exercise
    kind: match
    points: 10
    skill: nghia-tu
    prompt: "Nối từ tiếng Anh với nghĩa tiếng Việt."
    option_lang: en
    pairs:
      - { left: "ball", right: "quả bóng" }
      - { left: "doll", right: "búp bê" }
      - { left: "car", right: "xe ô tô" }
      - { left: "kite", right: "con diều" }
    answer: { pairs: [["ball", "quả bóng"], ["doll", "búp bê"], ["car", "xe ô tô"], ["kite", "con diều"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "ball là quả bóng; doll là búp bê; car là xe ô tô; kite là con diều."

  - id: b11
    type: summary
    markdown: "Bé đã biết **ball**, **doll**, **car**, **kite**. Giỏi lắm!"
    say:
      - { t: "Bé đã biết", l: vi }
      - { t: "ball, doll, car, kite.", l: en }
      - { t: "Giỏi lắm!", l: vi }

