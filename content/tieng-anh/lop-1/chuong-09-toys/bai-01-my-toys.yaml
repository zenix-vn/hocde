    type: exercise
    kind: mcq
    points: 10
    skill: nghia-car
    prompt: "Xe ô tô tiếng Anh là gì? 🚗"
    option_lang: en
    options:
      - { id: a, text: "car" }
      - { id: b, text: "kite" }
      - { id: c, text: "ball" }
    answer: { correct: [a] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Xe ô tô tiếng Anh là car."

  - id: b9
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-kite
    prompt: "Con diều tiếng Anh là gì? 🪁"
