schema: 1
slug: anh1-family-1
title: "Mom and dad"
summary: "Gọi mẹ, bố, bà, ông: mom, dad, grandma, grandpa."
est_minutes: 6
xp_reward: 20
status: published
blocks:
  - id: b1
    type: mascot_say
    mascot: fox
    mood: happy
    text: "Mình học cách gọi người thân trong nhà nhé!"
    say:
      - { t: "Mình học cách gọi người thân trong nhà nhé! Bé nghe và nhắc lại theo mình.", l: vi }

  - id: b2
    type: interactive
    kind: flashcards
    config:
      lang: en
      caption: "Bé chạm vào từng thẻ để nghe và nhắc lại."
      cards:
        - { word: "mom", emoji: "👩", meaning: "mẹ" }
        - { word: "dad", emoji: "👨", meaning: "bố" }
        - { word: "grandma", emoji: "👵", meaning: "bà" }
        - { word: "grandpa", emoji: "👴", meaning: "ông" }
    say:
      - { t: "Bé chạm vào từng thẻ để nghe nhé.", l: vi }

  - id: b3
    type: callout
    variant: remember
    markdown: "Ghi nhớ: **mom** (mẹ) · **dad** (bố) · **grandma** (bà) · **grandpa** (ông)"
    say: [{ t: "mom", l: en }, { t: "mẹ", l: vi }, { t: "dad", l: en }, { t: "bố", l: vi }, { t: "grandma", l: en }, { t: "bà", l: vi }, { t: "grandpa", l: en }, { t: "ông", l: vi }]

  - id: b4
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-mom
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "mom", lang: en }
    options:
      - { id: a, text: "👩", say: "mom", lang: en }
      - { id: b, text: "👨", say: "dad", lang: en }
      - { id: c, text: "👵", say: "grandma", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là mom, nghĩa là mẹ."

  - id: b5
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-dad
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "dad", lang: en }
    options:
      - { id: a, text: "👵", say: "grandma", lang: en }
      - { id: b, text: "👨", say: "dad", lang: en }
      - { id: c, text: "👴", say: "grandpa", lang: en }
    answer: { correct: [b] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là dad, nghĩa là bố."

  - id: b6
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-grandma
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "grandma", lang: en }
    options:
      - { id: a, text: "👴", say: "grandpa", lang: en }
      - { id: b, text: "👩", say: "mom", lang: en }
      - { id: c, text: "👵", say: "grandma", lang: en }
    answer: { correct: [c] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là grandma, nghĩa là bà."

  - id: b7
    type: exercise
    kind: listen_choose
    points: 10
    skill: nghe-grandpa
    prompt: "Nghe và chọn hình bé nghe được."
    listen: { text: "grandpa", lang: en }
    options:
      - { id: a, text: "👴", say: "grandpa", lang: en }
      - { id: b, text: "👩", say: "mom", lang: en }
      - { id: c, text: "👨", say: "dad", lang: en }
    answer: { correct: [a] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là grandpa, nghĩa là ông."

  - id: b8
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-grandma
    prompt: "Bà tiếng Anh là gì? 👵"
    option_lang: en
    options:
      - { id: a, text: "grandma" }
      - { id: b, text: "grandpa" }
      - { id: c, text: "mom" }
    answer: { correct: [a] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Bà tiếng Anh là grandma."

  - id: b9
    type: exercise
    kind: mcq
    points: 10
    skill: nghia-grandpa
    prompt: "Ông tiếng Anh là gì? 👴"
    option_lang: en
    options:
      - { id: a, text: "mom" }
      - { id: b, text: "grandpa" }
      - { id: c, text: "dad" }
    answer: { correct: [b] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại."
    explanation: "Ông tiếng Anh là grandpa."

  - id: b10
    type: exercise
    kind: match
    points: 10
    skill: nghia-tu
    prompt: "Nối từ tiếng Anh với nghĩa tiếng Việt."
    option_lang: en
    pairs:
      - { left: "mom", right: "mẹ" }
      - { left: "dad", right: "bố" }
      - { left: "grandma", right: "bà" }
      - { left: "grandpa", right: "ông" }
    answer: { pairs: [["mom", "mẹ"], ["dad", "bố"], ["grandma", "bà"], ["grandpa", "ông"]] }
    hint: "Bé chạm vào thẻ ở trên để nghe lại từng từ."
    explanation: "mom là mẹ; dad là bố; grandma là bà; grandpa là ông."

  - id: b11
    type: summary
    markdown: "Bé đã biết **mom**, **dad**, **grandma**, **grandpa**. Giỏi lắm!"
    say:
      - { t: "Bé đã biết", l: vi }
      - { t: "mom, dad, grandma, grandpa.", l: en }
      - { t: "Giỏi lắm!", l: vi }

