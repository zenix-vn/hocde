      - { id: "a", text: "🦷", say: "toothache", lang: "en" }
      - { id: "b", text: "🤕", say: "headache", lang: "en" }
      - { id: "c", text: "🌡️", say: "fever", lang: "en" }
    answer: { correct: ["a"] }
    hint: "Bấm nút loa để nghe lại."
    explanation: "Đó là toothache."

