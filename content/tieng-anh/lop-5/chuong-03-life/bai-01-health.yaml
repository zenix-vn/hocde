    markdown: |
      **What's the matter? I have a headache.** Bạn bị làm sao? Mình bị đau đầu.

      **You should see a doctor.** Bạn nên đi khám bác sĩ.
    say: [{"t":"What's the matter?","l":"en"},{"t":"I have a headache.","l":"en"}]

