      - { id: "b", text: "goed" }
      - { id: "c", text: "go" }
    answer: { correct: ["a"] }
    hint: "Đọc kỹ rồi chọn đáp án."
    explanation: "go → went."
    option_lang: "en"
    say: [{"t":"Điền dạng quá khứ của go:","l":"vi"},{"t":"Last Sunday, I … to the zoo.","l":"en"}]

