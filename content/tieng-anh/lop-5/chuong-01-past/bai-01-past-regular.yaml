    markdown: |
      Động từ có quy tắc: thêm **-ed**. play → **played**, watch → **watched**.

      **What did you do yesterday? I played football.**
    say: [{"t":"What did you do yesterday?","l":"en"},{"t":"I played football.","l":"en"}]

