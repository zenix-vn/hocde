# OpenLiteSpeed vhost cho hocde.vn -> web (Next.js) 127.0.0.1:3380 (web tự rewrite /api/v1 sang api)
docRoot                   /usr/local/lsws/hocde.vn/html
vhDomain                  hocde.vn
vhAliases                 www.hocde.vn
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}
accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
}

index  {
  useServer               0
  autoIndex               0
  indexFiles              index.html
}

extprocessor hocdeweb {
  type                    proxy
  address                 127.0.0.1:3380
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteCond %{HTTPS} !on [OR]
RewriteCond %{HTTP_HOST} ^www\.hocde\.vn$ [NC]
RewriteRule ^/?(.*)$ https://hocde.vn/$1 [R=301,L]
  END_rules
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/hocde.vn/html/.well-known/acme-challenge/
  allowBrowse             1
}

context / {
  type                    proxy
  handler                 hocdeweb
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
Strict-Transport-Security max-age=31536000
X-Content-Type-Options nosniff
X-Frame-Options SAMEORIGIN
Referrer-Policy strict-origin-when-cross-origin
  END_extraHeaders
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/hocde.vn/privkey.pem
  certFile                /etc/letsencrypt/live/hocde.vn/fullchain.pem
  certChain               1
}
